############################################################
# CALC_SPRAY_SPEED — Calculate recommended speed for new area
# No motion. Prints theoretical speed and coverage density.
#
# Key relationships (constant nozzle flow rate F):
#   vol_per_pass = F * path / speed
#   path ~= W * (1 + H/step)  (zigzag)
#   speed_tgt = (ref_speed * tgt_path * tgt_passes) / (ref_path * ref_passes)
#
# Example with defaults:
#   Small area: 24x24mm @ 50mm/s, 150uL / 4 passes/fill
#   Large area: 50x50mm @ 53mm/s, 150uL / 1 pass/fill
#   Coverage density: 64 -> 60 nL/mm2 (93% of reference)
############################################################
[gcode_macro CALC_SPRAY_SPEED]
description: Calculate recommended spray speed for a new area based on reference fill data. No motion.
gcode:
  {% set ref_speed  = params.REF_SPEED|default(50)|int %}
  {% set ref_w      = params.REF_W|default(24)|int %}
  {% set ref_h      = params.REF_H|default(24)|int %}
  {% set ref_vol    = params.REF_VOL|default(150)|int %}
  {% set ref_passes = params.REF_PASSES|default(4)|int %}
  {% set tgt_w      = params.TARGET_W|default(50)|int %}
  {% set tgt_h      = params.TARGET_H|default(50)|int %}
  {% set tgt_passes = params.TARGET_PASSES|default(1)|int %}
  {% set step       = params.STEP|default(1)|int %}

  {% set ref_path     = ref_w * (1 + ref_h // step) %}
  {% set tgt_path     = tgt_w * (1 + tgt_h // step) %}
  {% set tgt_speed    = (ref_speed * tgt_path * tgt_passes) // (ref_path * ref_passes) %}
  {% set vol_pass_ref = ref_vol // ref_passes %}
  {% set vol_pass_tgt = ref_vol // tgt_passes %}
  {% set ref_cov      = (vol_pass_ref * 1000) // (ref_w * ref_h) %}
  {% set tgt_cov      = (vol_pass_tgt * 1000) // (tgt_w * tgt_h) %}
  {% set cov_pct      = (tgt_cov * 100) // ref_cov %}

  RESPOND MSG="=== SPRAY SPEED CALCULATOR ==="
  RESPOND MSG="Reference: {ref_w}x{ref_h}mm @ {ref_speed}mm/s, {ref_vol}uL / {ref_passes} passes/fill = {vol_pass_ref}uL/pass, {ref_cov}nL/mm2"
  RESPOND MSG="Target:    {tgt_w}x{tgt_h}mm, step={step}mm, {tgt_passes} pass(es)/fill = {vol_pass_tgt}uL/pass"
  RESPOND MSG="Path:      ref={ref_path}mm, target={tgt_path}mm"
  RESPOND MSG="Recommended speed: {tgt_speed}mm/s"
  RESPOND MSG="Coverage at target speed: {tgt_cov}nL/mm2  ({cov_pct}% of reference)"
  {% if cov_pct < 60 %}
  RESPOND MSG="WARNING: coverage density at {cov_pct}% of reference - confirm visually with CALIBRATE_SPRAY_SPEED"
  {% else %}
  RESPOND MSG="Coverage density comparable to reference. Confirm with CALIBRATE_SPRAY_SPEED."
  {% endif %}


############################################################
# CALIBRATE_SPRAY_SPEED — Spray 5 test bands at bracketed speeds
#
# Bands run bottom-to-top, slowest to fastest (50/75/100/125/150% of theoretical).
# Bands at or above 100% will NOT run out of ink mid-pass in production.
# Bands below 100% would run dry mid-pass — included as visual reference only.
#
# Find the lowest-speed band with complete coverage and use that speed.
#
# Defaults: 5 bands x 4mm tall x full target width, 2mm gap.
# Estimated ink at defaults (50x50 target, 53mm/s): ~65uL of a 150uL fill.
############################################################
[gcode_macro CALIBRATE_SPRAY_SPEED]
description: Spray 5 horizontal test bands at 50/75/100/125/150% of theoretical speed to find minimum speed for complete coverage.
gcode:
  {% set ref_speed  = params.REF_SPEED|default(50)|int %}
  {% set ref_w      = params.REF_W|default(24)|int %}
  {% set ref_h      = params.REF_H|default(24)|int %}
  {% set ref_vol    = params.REF_VOL|default(150)|int %}
  {% set ref_passes = params.REF_PASSES|default(4)|int %}
  {% set tgt_w      = params.TARGET_W|default(50)|int %}
  {% set tgt_h      = params.TARGET_H|default(50)|int %}
  {% set tgt_passes = params.TARGET_PASSES|default(1)|int %}
  {% set step       = params.STEP|default(1)|int %}
  {% set z          = params.Z|default(25)|int %}
  {% set band_h     = params.BAND_H|default(4)|int %}
  {% set band_w     = params.BAND_W|int if params.BAND_W is defined else tgt_w %}
  {% set band_gap   = params.BAND_GAP|default(2)|int %}
  {% set _d         = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set x0         = params.X_ORIGIN|int if params.X_ORIGIN is defined else _d.x_left|int %}
  {% set y0         = params.Y_ORIGIN|int if params.Y_ORIGIN is defined else _d.y_bottom|int %}
  {% set LASER_ALIGNMENT_STATUS = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if LASER_ALIGNMENT_STATUS == 0 %}
    RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."
  {% else %}
    {% set ref_path  = ref_w * (1 + ref_h // step) %}
    {% set tgt_path  = tgt_w * (1 + tgt_h // step) %}
    {% set tgt_speed = (ref_speed * tgt_path * tgt_passes) // (ref_path * ref_passes) %}
    {% set stride    = band_h + band_gap %}

    {% set s1 = (tgt_speed * 50)  // 100 %}
    {% set s2 = (tgt_speed * 75)  // 100 %}
    {% set s3 = tgt_speed %}
    {% set s4 = (tgt_speed * 125) // 100 %}
    {% set s5 = (tgt_speed * 150) // 100 %}
    {% set speeds = [s1, s2, s3, s4, s5] %}

    # ink estimate per band: F * band_path / speed, F = vol_pass_ref * ref_speed / ref_path
    {% set vol_pass_ref = ref_vol // ref_passes %}
    {% set band_unit    = (vol_pass_ref * ref_speed * band_h * band_w) // ref_path %}
    {% set vol_b1 = band_unit // s1 %}
    {% set vol_b2 = band_unit // s2 %}
    {% set vol_b3 = band_unit // s3 %}
    {% set vol_b4 = band_unit // s4 %}
    {% set vol_b5 = band_unit // s5 %}
    {% set vol_total = vol_b1 + vol_b2 + vol_b3 + vol_b4 + vol_b5 %}

    RESPOND MSG="=== SPRAY CALIBRATION === ({tgt_w}x{tgt_h}mm target, {tgt_passes} pass(es) per {ref_vol}uL fill)"
    RESPOND MSG="Theoretical speed: {tgt_speed}mm/s  (path {ref_path}mm -> {tgt_path}mm)"
    RESPOND MSG="Bands: {band_h}mm tall x {band_w}mm wide, {band_gap}mm gap, starting at (X{x0}, Y{y0})"
    RESPOND MSG="  Band 1 (Y{y0}):     {s1}mm/s (50%  - would run dry in production)"
    RESPOND MSG="  Band 2 (Y{y0 + stride}):   {s2}mm/s (75%  - would run dry in production)"
    RESPOND MSG="  Band 3 (Y{y0 + stride * 2}):  {s3}mm/s (100% - theoretical, uses {ref_vol}uL per full pass)"
    RESPOND MSG="  Band 4 (Y{y0 + stride * 3}):  {s4}mm/s (125%)"
    RESPOND MSG="  Band 5 (Y{y0 + stride * 4}):  {s5}mm/s (150%)"
    RESPOND MSG="Est. ink: ~{vol_total}uL total (b1={vol_b1} b2={vol_b2} b3={vol_b3} b4={vol_b4} b5={vol_b5})"
    RESPOND MSG="GOAL: pick lowest band with complete coverage. Only bands 3-5 are usable in production."

    G90
    G1 Z{z} F1200

    {% for i in range(5) %}
      {% set spd   = speeds[i] %}
      {% set y_top = y0 + i * stride + band_h %}
      RESPOND MSG="Spraying band {i + 1}/5: {spd}mm/s"
      M106 S0
      G1 X{x0} Y{y_top} Z{z} F3000
      M106 S255
      {% for y_off in range(0, band_h, 2) %}
        {% set ypos = y_top - y_off %}
        G1 X{x0}          Y{ypos}      Z{z} F{spd * 60}
        G1 X{x0 + band_w} Y{ypos}      Z{z} F{spd * 60}
        G1 X{x0 + band_w} Y{ypos - 1}  Z{z} F{spd * 60}
        G1 X{x0}          Y{ypos - 1}  Z{z} F{spd * 60}
      {% endfor %}
      M106 S0
    {% endfor %}

    G1 Z25 F3000
    SMART_MOVE X=0 Y=0
    RESPOND MSG="Done. Bands (bottom to top): {s1} / {s2} / {s3} / {s4} / {s5} mm/s"
    RESPOND MSG="Refill if needed before starting production job."
  {% endif %}
