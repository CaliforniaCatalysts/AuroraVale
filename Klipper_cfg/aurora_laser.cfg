############################################################
# LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT
############################################################
[gcode_macro LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT]
description: Record airbrush reference point for laser offset calibration
variable_airbrush_pos_x: -59.0
variable_airbrush_pos_y: 27.0
variable_laser_cal_step_one_status: 0
gcode:

  # Capture current nozzle (airbrush) position
  {% set airbrush_pos_x = printer.toolhead.position.x %}
  {% set airbrush_pos_y = printer.toolhead.position.y %}

  # Store captured position
  SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT VARIABLE=airbrush_pos_x VALUE={airbrush_pos_x}
  SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT VARIABLE=airbrush_pos_y VALUE={airbrush_pos_y}

  RESPOND MSG="Airbrush position recorded: X{airbrush_pos_x} Y{airbrush_pos_y}"
  RESPOND MSG="Move laser crosshair to the SAME point and run LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT"

  # Lift tool slightly for safety
  G1 Z25 F3000

  # Mark step one complete
  SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT VARIABLE=laser_cal_step_one_status VALUE=1


############################################################
# LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT
############################################################
[gcode_macro LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT]
description: Calculate nozzle-to-laser offset
variable_laser_offset_x: -59.0
variable_laser_offset_y: 27.0
variable_laser_cal_step_two_status: 0
gcode:

  # Verify step one was completed
  {% set status_step_one = printer["gcode_macro LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT"].laser_cal_step_one_status %}

  {% if status_step_one == 0 %}

     RESPOND MSG="Run LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT first."

  {% else %}

    # Retrieve stored airbrush reference
    {% set airbrush_pos_x = printer["gcode_macro LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT"].airbrush_pos_x %}
    {% set airbrush_pos_y = printer["gcode_macro LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT"].airbrush_pos_y %}

    # Capture current laser position
    {% set laser_pos_x = printer.toolhead.position.x %}
    {% set laser_pos_y = printer.toolhead.position.y %}

    # Calculate offset between nozzle and laser
    {% set offset_x = airbrush_pos_x - laser_pos_x %}
    {% set offset_y = airbrush_pos_y - laser_pos_y %}

    # Store calculated offsets
    SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_offset_x VALUE={offset_x}
    SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_offset_y VALUE={offset_y}

    RESPOND MSG="Laser position recorded: X{laser_pos_x} Y{laser_pos_y}"
    RESPOND MSG="Calculated offset: X{offset_x} Y{offset_y}"

    # Mark calibration complete
    SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_cal_step_two_status VALUE=1

  {% endif %}


############################################################
# LASER_ALIGNMENT_FROM_BL_CORNER
############################################################
[gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER]
description: Align nozzle to BL corner using laser crosshair and set machine origin
variable_laser_alignment_complete: 0
variable_offset_x: -59
variable_offset_y: 27
variable_laser_x_pos: 0
variable_laser_y_pos: 0
variable_previous_bl_x: 0
variable_previous_bl_y: 0
gcode:

  # Ensure printer XY is homed
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
     RESPOND MSG="Homing XY for laser alignment"
     G28 X Y
  {% endif %}

  # If alignment was already completed, restore the original machine coordinate system
  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 1 %}
     # Reset G92 by setting display = physical at current position, zeroing any prior offset
     {% set phys_x = printer.toolhead.position.x %}
     {% set phys_y = printer.toolhead.position.y %}

     RESPOND MSG="Previous alignment detected – resetting coordinate offset"

     G90
     G92 X{phys_x} Y{phys_y}
  {% endif %}

  # Determine whether calibrated offsets are available
  {% set status_laser_cal = printer["gcode_macro LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT"].laser_cal_step_two_status %}

  {% if status_laser_cal == 1 %}

     # Use calibrated offset values
     {% set offset_x = printer["gcode_macro LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT"].laser_offset_x|float %}
     {% set offset_y = printer["gcode_macro LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT"].laser_offset_y|float %}

     RESPOND MSG="Using calibrated offset X{offset_x} Y{offset_y}"

  {% else %}

     # Fallback to default offsets
     RESPOND MSG="Laser offset not calibrated. Using defaults"

     {% set offset_x = params.LASER_X_OFFSET|default(-59)|float %}
     {% set offset_y = params.LASER_Y_OFFSET|default(27)|float %}

  {% endif %}

  # Capture the laser crosshair reference position
  {% set laser_x_pos = printer.toolhead.position.x %}
  {% set laser_y_pos = printer.toolhead.position.y %}

  RESPOND MSG="Laser reference position X{laser_x_pos} Y{laser_y_pos}"

  # Trace 22x22 square with laser for visual reference
     G1 X{laser_x_pos} Y{laser_y_pos} F1000
  G1 X{laser_x_pos} Y{laser_y_pos + 22}
  G1 X{laser_x_pos + 22} Y{laser_y_pos + 22}
  G1 X{laser_x_pos + 22} Y{laser_y_pos}
  G1 X{laser_x_pos} Y{laser_y_pos}

  RESPOND MSG="Moving nozzle using offset X{offset_x} Y{offset_y}"

  # Calculate BL corner
  {% set bl_x = laser_x_pos + offset_x %}
  {% set bl_y = laser_y_pos + offset_y %}

  # Move nozzle to the calculated BL corner
  G1 X{bl_x} Y{bl_y} F3000

  # Trace the same square using the nozzle
  G1 X{bl_x} Y{bl_y} F3000
  G1 X{bl_x} Y{bl_y + 22}
  G1 X{bl_x + 22} Y{bl_y + 22}
  G1 X{bl_x + 22} Y{bl_y}
  G1 X{bl_x} Y{bl_y}

  # Lift tool for safety
  G1 Z25 F3000

  # Capture the current machine coordinates BEFORE redefining origin
  {% set machine_x_before_g92 = printer.toolhead.position.x %}
  {% set machine_y_before_g92 = printer.toolhead.position.y %}

  # Set machine origin to the BL corner
  G92 X0 Y0

  # Store the machine coordinates that existed before G92 so reruns can restore them
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=previous_bl_x VALUE={machine_x_before_g92}
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=previous_bl_y VALUE={machine_y_before_g92}

  # Store alignment state
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_alignment_complete VALUE=1
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=offset_x VALUE={offset_x}
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=offset_y VALUE={offset_y}
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_x_pos VALUE={laser_x_pos}
  SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_y_pos VALUE={laser_y_pos}

  RESPOND MSG="Laser alignment complete"
  RESPOND MSG="Machine coordinate (0,0) set to BL corner"

############################################################
# LASER_AREA_SCAN_EDGES
############################################################
[gcode_macro LASER_AREA_SCAN_EDGES]
description: Continuously scan spray perimeter so user can adjust area size
variable_area_x: 22
variable_area_y: 22
variable_scan_speed: 10
gcode:

  # Use relative moves so manual jog adjustments shift the scan path
  G91

  {% set size_x = printer["gcode_macro LASER_AREA_SCAN_EDGES"].area_x|float %}   # mm
  {% set size_y = printer["gcode_macro LASER_AREA_SCAN_EDGES"].area_y|float %}   # mm
  {% set feed = printer["gcode_macro LASER_AREA_SCAN_EDGES"].scan_speed|float %} # mm/s

  RESPOND MSG="Scanning perimeter X{size_x} Y{size_y} Speed:{feed}mm/s"

  # Trace perimeter relative to current position (feed converted mm/s -> mm/min)
  G1 X0 Y{size_y} F{feed * 60}
  G4 P150
  G1 X{size_x} Y0 F{feed * 60}
  G4 P150
  G1 X0 Y-{size_y} F{feed * 60}
  G4 P150
  G1 X-{size_x} Y0 F{feed * 60}
  G4 P150

  # Return to absolute mode so manual jog works normally
  G90

  # Schedule next loop (small delay allows jog commands to take effect)
  UPDATE_DELAYED_GCODE ID=laser_area_scan_loop DURATION=0.25


############################################################
# DELAYED LOOP FOR PERIMETER SCAN
############################################################
[delayed_gcode laser_area_scan_loop]
gcode:
  LASER_AREA_SCAN_EDGES


############################################################
# SET_LASER_SCAN_SPEED
############################################################
[gcode_macro SET_LASER_SCAN_SPEED]
description: Adjust laser perimeter scan speed (SPEED in mm/s)
# Usage: SET_LASER_SCAN_SPEED SPEED=10

gcode:
  {% set new_speed = params.SPEED|default(10)|int %}  # mm/s

  SET_GCODE_VARIABLE MACRO=LASER_AREA_SCAN_EDGES VARIABLE=scan_speed VALUE={new_speed}

  RESPOND MSG="Laser scan speed set to {new_speed}mm/s"


############################################################
# LASER_AREA_SCAN_STOP
############################################################
[gcode_macro LASER_AREA_SCAN_STOP]
description: Stop the perimeter scanning motion
gcode:
  UPDATE_DELAYED_GCODE ID=laser_area_scan_loop DURATION=0
  RESPOND MSG="Laser area scan stopped"


############################################################
# SPRAY_AREA_DEFAULTS
############################################################
[gcode_macro SPRAY_AREA_DEFAULTS]
description: Stores global spray area size used by spray job macros
variable_x_right: 22
variable_y_top: 22
gcode:
  RESPOND MSG="Current spray area defaults X{printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right} Y{printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top}"


############################################################
# SET_SPRAY_AREA_SIZE
############################################################
[gcode_macro SET_SPRAY_AREA_SIZE]
description: Save a new spray area size and propagate to spray job defaults
# Usage: SET_SPRAY_AREA_SIZE X=25 Y=25

gcode:

  # Requested new spray area
  {% set new_x = params.X|default(22)|float %}  # mm
  {% set new_y = params.Y|default(22)|float %}  # mm

  # Update scan macro size
  SET_GCODE_VARIABLE MACRO=LASER_AREA_SCAN_EDGES VARIABLE=area_x VALUE={new_x}
  SET_GCODE_VARIABLE MACRO=LASER_AREA_SCAN_EDGES VARIABLE=area_y VALUE={new_y}

  # Update global spray defaults used by aurora_spray.cfg
  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=x_right VALUE={new_x}
  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=y_top VALUE={new_y}

  RESPOND MSG="Spray area updated to X{new_x} Y{new_y}"
  RESPOND MSG="RUN_SPRAY_JOB will now default to X_RIGHT={new_x} Y_TOP={new_y}"

  # NOTE FOR aurora_spray.cfg
  # In RUN_SPRAY_JOB replace the default lines with:
  # {% set x_right = params.X_RIGHT|default(printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right)|int %}
  # {% set y_top   = params.Y_TOP|default(printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top)|int %}



############################################################
############################################################
# SMART_MOVE (shared safe move helper)
############################################################
[gcode_macro SMART_MOVE]
description: Move XY safely, handling high-Z return from ink fill and avoiding the ring weight around the mask

gcode:

  {% set tx = params.X|float %}
  {% set ty = params.Y|float %}
  {% set current_z = printer.toolhead.position.z %}

  # Spray area center (ring weight is centered here)
  {% set x_right = printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right|float %}
  {% set y_top = printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top|float %}
  {% set cx = x_right / 2 %}
  {% set cy = y_top / 2 %}

  # Ring geometry
  {% set ring_od = 65.0 %}
  {% set ring_id = 37.0 %}
  {% set r_outer = ring_od / 2 %}
  {% set r_inner = ring_id / 2 %}

  # Distance from target point to ring center
  {% set dx = tx - cx %}
  {% set dy = ty - cy %}
  {% set dist = (dx*dx + dy*dy) ** 0.5 %}

  G90

  # Case 1: Returning from ink fill position
  {% if current_z > 75 %}
     G1 X{tx} Y{ty} Z25 F3000

  # Case 2: Target XY is within the ring wall region and tool is low
  {% elif dist < r_outer and dist > r_inner and current_z <= 6 %}
     RESPOND MSG="Avoiding mask weight ring"
     G1 Z7 F3000
     G1 X{tx} Y{ty} F3000

  # Case 3: Normal XY move
  {% else %}
     G1 X{tx} Y{ty} F3000
  {% endif %}


############################################################
# MOVE_TO_LASER_ZERO
############################################################
[gcode_macro MOVE_TO_LASER_ZERO]
description: Move nozzle so the laser crosshair is over the spray BL corner (0,0) — returns to the position used during alignment
gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 0 %}

     RESPOND MSG="Laser alignment has not been completed yet. Run LASER_ALIGNMENT_FROM_BL_CORNER first."

  {% else %}

     # laser = nozzle + offset, so for laser at (0,0): nozzle = -offset
     {% set lx = -printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].offset_x %}
     {% set ly = -printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].offset_y %}

     RESPOND MSG="Moving so laser crosshair is over BL corner — nozzle to X{lx} Y{ly}"

     # Move to safe height before XY travel
     G90
     SMART_MOVE X={lx} Y={ly}

  {% endif %}


############################################################
# MOVE_TO_SPRAY_BL_CORNER
############################################################
[gcode_macro MOVE_TO_SPRAY_BL_CORNER]
description: Move to spray bottom-left corner (machine 0,0) with conditional Z lift
gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 0 %}

     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."

  {% else %}
     # Move to safe height before XY travel
     G90
     RESPOND MSG="Moving to nozzle BL corner (0,0)"
     SMART_MOVE X=0 Y=0

  {% endif %}


