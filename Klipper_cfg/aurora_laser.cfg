description: Display current laser alignment, offsets, and spray area configuration

gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}
  {% set offset_x = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].offset_x %}
  {% set offset_y = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].offset_y %}
  {% set laser_x = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_x_pos %}
  {% set laser_y = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_y_pos %}
  {% set x_right = printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right %}
  {% set y_top = printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top %}

  RESPOND MSG="===== SPRAY SYSTEM STATE ====="
  RESPOND MSG="Alignment complete: {align_done}"
  RESPOND MSG="Laser reference position: X{laser_x} Y{laser_y}"
  RESPOND MSG="Laser → nozzle offset: X{offset_x} Y{offset_y}"
  RESPOND MSG="Spray area size: X{x_right} Y{y_top}"
  RESPOND MSG="Current toolhead position: X{printer.toolhead.position.x} Y{printer.toolhead.position.y} Z{printer.toolhead.position.z}"
  RESPOND MSG="=============================="


############################################################
# RESTORE_SPRAY_ORIGIN
############################################################
[gcode_macro RESTORE_SPRAY_ORIGIN]
description: Restore BL spray origin after firmware restart using stored alignment values (does NOT move the toolhead, only restores coordinates)

gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 1 %}

     {% set prev_x = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].previous_bl_x %}
     {% set prev_y = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].previous_bl_y %}

     RESPOND MSG="Restoring spray BL origin"

     G90
     G92 X{prev_x} Y{prev_y}
     G92 X0 Y0

     RESPOND MSG="Spray origin restored"

  {% else %}

     RESPOND MSG="No stored alignment available. Run LASER_ALIGNMENT_FROM_BL_CORNER"

  {% endif %}


############################################################
# AUTO RESTORE ON STARTUP (after homing)
############################################################
[delayed_gcode restore_spray_origin_startup]
initial_duration: 2

gcode:
  # Only restore origin after the printer has been homed
  {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
     RESTORE_SPRAY_ORIGIN
  {% else %}
     # If not homed yet, try again shortly
     UPDATE_DELAYED_GCODE ID=restore_spray_origin_startup DURATION=2
  {% endif %}


############################################################
# DASHBOARD USER MACROS (Recommended to expose in Mainsail)
############################################################
# These are the primary operator controls that should appear
# as buttons on the Mainsail dashboard.
#
# Alignment / Setup
#   LASER_OFFSET_CAL_STEP_ONE_AIRBRUSH_TOUCH_POINT
#   LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT
#   LASER_ALIGNMENT_FROM_BL_CORNER
#
# Navigation / Positioning
#   MOVE_TO_LASER_ZERO
#   MOVE_TO_SPRAY_BL_CORNER
#   MOVE_TO_SPRAY_TR_CORNER
#
# Area Setup
#   LASER_AREA_SCAN_EDGES
#   LASER_AREA_SCAN_STOP
#   SET_LASER_SCAN_SPEED
#   SET_SPRAY_AREA_SIZE
#   VERIFY_SPRAY_AREA
#
# Informational
#   SPRAY_AREA_DEFAULTS
#
# Typical Operator Workflow:
#   1. LASER_ALIGNMENT_FROM_BL_CORNER
#   2. LASER_AREA_SCAN_EDGES
#   3. Adjust mask using jog
#   4. SET_SPRAY_AREA_SIZE X=? Y=?
#   5. LASER_AREA_SCAN_STOP
#   6. VERIFY_SPRAY_AREA
#   7. RUN_SPRAY_JOB (from aurora_spray.cfg)
