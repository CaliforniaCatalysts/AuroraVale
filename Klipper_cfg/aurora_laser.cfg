############################################################
# VERIFY_SPRAY_AREA
############################################################
[gcode_macro VERIFY_SPRAY_AREA]
description: Trace the spray rectangle once with the nozzle so the operator can visually verify the mask area

gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 0 %}

     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."

  {% else %}

     {% set x_right = printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right|float %}
     {% set y_top = printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top|float %}
     RESPOND MSG="Verifying spray area perimeter X{x_right} Y{y_top}"

     # Move to safe height before XY travel
     G90
     G1 Z25 F3000

     # Trace perimeter once at moderate speed
     G1 X0 Y0 F3000
     G1 X0 Y{y_top} F1500
     G1 X{x_right} Y{y_top} F1500
     G1 X{x_right} Y0 F1500
     G1 X0 Y0 F1500

     RESPOND MSG="Spray area verification complete"

  {% endif %}


