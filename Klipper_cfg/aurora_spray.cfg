############################################################
# SPRAY_STATE — shared runtime state for the spray job loop
############################################################
[gcode_macro SPRAY_STATE]
description: Shared state for spray job loop controller
variable_stop_requested: 0
variable_pause_requested: 0
variable_job_active: 0
variable_current_pass: 0
variable_total_passes: 4
variable_step: 1
variable_dry_time: 2000
variable_z: 25
variable_x_left: 0
variable_x_right: 22
variable_y_bottom: 0
variable_y_top: 22
variable_speed: 50
variable_edge_speed_mult: 1.5
variable_job_type: 0
variable_current_line: 0
variable_pass_a_start: 0
variable_pass_a_end: 0
variable_pass_range_min: 0
variable_pass_range_max: 0
variable_pass_end_x: 0
variable_pass_end_y: 0
variable_pass_reversed: 0
variable_pass_horizontal: 1
variable_pass_in_progress: 0
variable_pass_resuming: 0
gcode:
  RESPOND MSG="job_active={printer['gcode_macro SPRAY_STATE'].job_active} pass={printer['gcode_macro SPRAY_STATE'].current_pass}/{printer['gcode_macro SPRAY_STATE'].total_passes} stop_requested={printer['gcode_macro SPRAY_STATE'].stop_requested} paused={printer['gcode_macro SPRAY_STATE'].pause_requested}"


############################################################
# SPRAY_JOB_NEXT_PASS — starts one pass, delegates to line loop
############################################################
[gcode_macro SPRAY_JOB_NEXT_PASS]
description: Advance spray job by one pass — called by spray_job_loop delayed_gcode
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% set cp = s.current_pass %}
  {% set tp = s.total_passes %}

  {% if s.pause_requested == 1 %}
    RESPOND MSG="Spray paused at pass {cp}/{tp}"

  {% elif s.stop_requested == 1 or cp >= tp %}
    SET_PIN PIN=fan0 VALUE=0.00
    G90
    G1 Z25 F3000
    SMART_MOVE X=0 Y=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    {% if s.stop_requested == 1 %}
      RESPOND MSG="Spray stopped after {cp}/{tp} passes"
    {% else %}
      RESPOND MSG="Spray run complete"
      MOVE_TO_INK_FILL_POSITION
    {% endif %}

  {% else %}
    {% set pass_in_layer = cp % 4 %}
    {% set layer_i = (cp // 4) + 1 %}
    {% set total_layers = tp // 4 %}
    RESPOND MSG="Layer {layer_i}/{total_layers} — Pass {pass_in_layer + 1}/4"

    {% if s.job_type == 0 %}
      {% if pass_in_layer == 0 %}
        SPRAY_HORIZONTAL_TL_BR STEP={s.step} X_START={s.x_left} X_END={s.x_right} Y_START={s.y_top} Y_END={s.y_bottom} Z={s.z} SPEED={s.speed}
      {% elif pass_in_layer == 1 %}
        SPRAY_VERTICAL_TR_BL STEP={s.step} X_START={s.x_right} X_END={s.x_left} Y_START={s.y_top} Y_END={s.y_bottom} Z={s.z} SPEED={s.speed}
      {% elif pass_in_layer == 2 %}
        SPRAY_HORIZONTAL_BR_TL STEP={s.step} X_START={s.x_right} X_END={s.x_left} Y_START={s.y_bottom} Y_END={s.y_top} Z={s.z} SPEED={s.speed}
      {% else %}
        SPRAY_VERTICAL_BL_TR STEP={s.step} X_START={s.x_left} X_END={s.x_right} Y_START={s.y_bottom} Y_END={s.y_top} Z={s.z} SPEED={s.speed}
      {% endif %}
    {% else %}
      {% if pass_in_layer == 0 %}
        SPRAY_ZZ_HORIZONTAL_TL_BR STEP={s.step} X_START={s.x_left} X_END={s.x_right} Y_START={s.y_top} Y_END={s.y_bottom} Z={s.z} SPEED={s.speed}
      {% elif pass_in_layer == 1 %}
        SPRAY_ZZ_VERTICAL_TR_BL STEP={s.step} X_START={s.x_right} X_END={s.x_left} Y_START={s.y_top} Y_END={s.y_bottom} Z={s.z} SPEED={s.speed}
      {% elif pass_in_layer == 2 %}
        SPRAY_ZZ_HORIZONTAL_BR_TL STEP={s.step} X_START={s.x_right} X_END={s.x_left} Y_START={s.y_bottom} Y_END={s.y_top} Z={s.z} SPEED={s.speed}
      {% else %}
        SPRAY_ZZ_VERTICAL_BL_TR STEP={s.step} X_START={s.x_left} X_END={s.x_right} Y_START={s.y_bottom} Y_END={s.y_top} Z={s.z} SPEED={s.speed}
      {% endif %}
    {% endif %}
  {% endif %}


############################################################
# DELAYED LOOP FOR SPRAY JOB (between passes)
############################################################
[delayed_gcode spray_job_loop]
gcode:
  SPRAY_JOB_NEXT_PASS


############################################################
# DELAYED LOOP FOR SPRAY LINES (within a pass, line-by-line)
############################################################
[delayed_gcode spray_line_loop]
gcode:
  SPRAY_NEXT_LINE


############################################################
# SPRAY_NEXT_LINE — execute one line, check pause/stop, reschedule
# Pause response: ~50ms (one line of motion at most before stopping)
# On resume: repositions to line start without spray, then sprays
############################################################
[gcode_macro SPRAY_NEXT_LINE]
description: Execute one line of the current pass; checks pause/stop flag before each line
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% set i = s.current_line %}
  {% set step = s.step %}
  {% set total = ((s.pass_range_max - s.pass_range_min) // (step * 2))|int %}

  {% if s.pause_requested == 1 or s.stop_requested == 1 %}
    SET_PIN PIN=fan0 VALUE=0.00
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=0

  {% elif i >= total %}
    SET_PIN PIN=fan0 VALUE=0.00
    G1 X{s.pass_end_x} Y{s.pass_end_y} Z{s.z} F{s.speed * 60}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_pass VALUE={s.current_pass + 1}
    {% if s.job_active == 1 %}
      UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION={s.dry_time / 1000}
    {% else %}
      RESPOND MSG="Pass complete"
    {% endif %}

  {% else %}
    {% if s.pass_reversed == 1 %}
      {% set pos = (s.pass_range_max - i * step * 2)|int %}
      {% set p1 = (pos - step)|int %}
      {% set p2 = (pos - step * 2)|int %}
    {% else %}
      {% set pos = (s.pass_range_min + i * step * 2)|int %}
      {% set p1 = (pos + step)|int %}
      {% set p2 = (pos + step * 2)|int %}
    {% endif %}

    {% if s.pass_resuming == 1 %}
      {% if s.job_type == 0 %}
        {% if s.pass_horizontal == 1 %}
          G1 X{s.pass_a_start} Y{pos} Z{s.z} F{s.speed * 60}
        {% else %}
          G1 X{pos} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
        {% endif %}
      {% else %}
        {% if s.pass_horizontal == 1 %}
          G1 X{s.pass_a_start} Y{p1} Z{s.z} F{s.speed * 60}
        {% else %}
          G1 X{p1} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
        {% endif %}
      {% endif %}
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_resuming VALUE=0
    {% endif %}

    SET_PIN PIN=fan0 VALUE=255.00
    {% if s.job_type == 0 %}
      {% if s.pass_horizontal == 1 %}
        G1 X{s.pass_a_start} Y{pos} Z{s.z} F{s.speed * 60}
        G1 X{s.pass_a_end} Y{pos} Z{s.z} F{s.speed * 60}
        G1 X{s.pass_a_end} Y{p1} Z{s.z} F{s.speed * 60}
        G1 X{s.pass_a_start} Y{p1} Z{s.z} F{s.speed * 60}
        G1 X{s.pass_a_start} Y{p2} Z{s.z} F{s.speed * 60}
      {% else %}
        G1 X{pos} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
        G1 X{pos} Y{s.pass_a_end} Z{s.z} F{s.speed * 60}
        G1 X{p1} Y{s.pass_a_end} Z{s.z} F{s.speed * 60}
        G1 X{p1} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
        G1 X{p2} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
      {% endif %}
    {% else %}
      {% if s.pass_horizontal == 1 %}
        G1 X{s.pass_a_start} Y{p1} Z{s.z} F{s.speed * 60}
        G1 X{s.pass_a_end} Y{p2} Z{s.z} F{s.speed * 60}
      {% else %}
        G1 X{p1} Y{s.pass_a_start} Z{s.z} F{s.speed * 60}
        G1 X{p2} Y{s.pass_a_end} Z{s.z} F{s.speed * 60}
      {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_line VALUE={i + 1}
    UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.05
  {% endif %}


############################################################
# STOP
############################################################
[gcode_macro STOP]
description: Stop spray job after current line completes
gcode:
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=1
  SET_PIN PIN=fan0 VALUE=0.00


############################################################
# PAUSE_PASS — works for both RUN_SPRAY_JOB and individual passes
############################################################
[gcode_macro PAUSE_PASS]
description: Pause spray; stops after current line, moves to ink fill position
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.job_active == 1 or s.pass_in_progress == 1 %}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=1
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0
    SET_PIN PIN=fan0 VALUE=0.00
    G90
    G1 Z25 F3000
    MOVE_TO_INK_FILL_POSITION
    RESPOND MSG="Spray paused at pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No active spray job to pause"
  {% endif %}


############################################################
# STOP_RUN — works for both RUN_SPRAY_JOB and individual passes
############################################################
[gcode_macro STOP_RUN]
description: Immediately stop spray and move to ink fill position (cannot resume)
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.job_active == 1 or s.pass_in_progress == 1 %}
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0
    UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0
    SET_PIN PIN=fan0 VALUE=0.00
    G90
    G1 Z25 F3000
    MOVE_TO_INK_FILL_POSITION
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=1
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=0
    RESPOND MSG="Spray stopped at pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No active spray job to stop"
  {% endif %}


############################################################
# RESUME_PASS — works for both RUN_SPRAY_JOB and individual passes
############################################################
[gcode_macro RESUME_PASS]
description: Resume spray from where it was paused; repositions to spray line before enabling spray
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.pause_requested == 1 %}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
    {% if s.pass_in_progress == 1 %}
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_resuming VALUE=1
      UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.1
    {% else %}
      UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0.1
    {% endif %}
    RESPOND MSG="Spray resumed from pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No paused spray job to resume"
  {% endif %}


############################################################
# RUN_SPRAY_JOB
############################################################
[gcode_macro RUN_SPRAY_JOB]
description: Run spray job. X_LEFT/X_RIGHT/Y_BOTTOM/Y_TOP default to stored spray area — run SPRAY_AREA_DEFAULTS to see current values.
gcode:
  {% set layers = params.LAYERS|default(1)|int %}        # count
  {% set step = params.STEP|default(1)|int %}            # mm
  {% set dry_time = params.DRY_TIME|default(2000)|int %} # ms
  {% set z = params.Z|default(25)|int %}                 # mm
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set x_left   = params.X_LEFT|int   if params.X_LEFT   is defined else _d.x_left|int %}   # mm
  {% set x_right  = params.X_RIGHT|int  if params.X_RIGHT  is defined else _d.x_right|int %}  # mm
  {% set y_bottom = params.Y_BOTTOM|int if params.Y_BOTTOM is defined else _d.y_bottom|int %}  # mm
  {% set y_top    = params.Y_TOP|int    if params.Y_TOP    is defined else _d.y_top|int %}     # mm
  {% set SPEED = params.SPEED|default(50)|int %}         # mm/s
  {% set LASER_ALIGNMENT_STATUS = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if LASER_ALIGNMENT_STATUS == 0 %}
     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."
  {% else %}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=1
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_pass VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=total_passes VALUE={layers * 4}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=step VALUE={step}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=dry_time VALUE={dry_time}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=z VALUE={z}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=x_left VALUE={x_left}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=x_right VALUE={x_right}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=y_bottom VALUE={y_bottom}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=y_top VALUE={y_top}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=speed VALUE={SPEED}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_type VALUE=0
     G90
     G1 Z{z} F1200
     G1 X{x_left} Y{y_top} F{SPEED * 60}
     UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0.1
  {% endif %}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


;Pass #1 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_TL_BR]
description: Single pass horizontal spray from top left to bottom right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %}
  {% set Y_START = params.Y_START|default(22)|int %}
  {% set Y_END = params.Y_END|default(0)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}

  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_line VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_start VALUE={X_START}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_end VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_min VALUE={range_min}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_max VALUE={range_max}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_x VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_y VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_reversed VALUE=1
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_horizontal VALUE=1
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=1

  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.05


;Pass #2 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_BR_TL]
description: Single pass horizontal spray from bottom right to top left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %}
  {% set Y_START = params.Y_START|default(0)|int %}
  {% set Y_END = params.Y_END|default(22)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}

  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_line VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_start VALUE={X_START}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_end VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_min VALUE={range_min}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_max VALUE={range_max}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_x VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_y VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_reversed VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_horizontal VALUE=1
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=1

  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.05


;Pass #3 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_TR_BL]
description: Single pass vertical spray from top right to bottom left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %}
  {% set Y_START = params.Y_START|default(22)|int %}
  {% set Y_END = params.Y_END|default(0)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}

  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_line VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_start VALUE={Y_START}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_end VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_min VALUE={range_min}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_max VALUE={range_max}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_x VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_y VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_reversed VALUE=1
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_horizontal VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=1

  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.05


;Pass #4 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_BL_TR]
description: Single pass vertical spray from bottom left to top right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %}
  {% set Y_START = params.Y_START|default(0)|int %}
  {% set Y_END = params.Y_END|default(22)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}

  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_line VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_start VALUE={Y_START}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_a_end VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_min VALUE={range_min}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_max VALUE={range_max}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_x VALUE={X_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_end_y VALUE={Y_END}
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_reversed VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_horizontal VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_in_progress VALUE=1

  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  UPDATE_DELAYED_GCODE ID=spray_line_loop DURATION=0.05
