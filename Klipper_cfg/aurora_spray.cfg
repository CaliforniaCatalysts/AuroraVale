#main function that calls each pattern macro:

[gcode_macro RUN_SPRAY_JOB]
description: Run spray coating job using stored laser alignment offset
gcode:
  {% set layers = params.LAYERS|default(1)|int %}
  {% set step = params.STEP|default(1)|int %}
  {% set dry_time = params.DRY_TIME|default(2000)|int %}
  {% set z = params.Z|default(25)|int %}
  {% set x_left = params.X_LEFT|default(0)|int %}
  {% set x_right = params.X_RIGHT|default(printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right)|int %}
  {% set y_bottom = params.Y_BOTTOM|default(0)|int %}
  {% set y_top   = params.Y_TOP|default(printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top)|int %}
  {% set speed = params.SPEED|default(3000)|int %}
  {% set LASER_ALIGNMENT_STATUS = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}
  
  {% if LASER_ALIGNMENT_STATUS == 0 %}
     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."
  {% else %}
     G90
     G1 Z{z} F1200
     G1 X{x_left} Y{y_top} F{speed} ;starting position at TL
  
  {% for layer in range(layers) %}
  
    {% set layer_i = layer + 1 %}
    {% set base_pass = layer * 4 %}
  
    RESPOND MSG="Starting Layer {layer_i}/{layers}"
  
    # PASS 1
    {% set pass_i = base_pass + 1 %}
    SET_DISPLAY_PROGRESS PROGRESS={(pass_i-1)/total_passes}
    RESPOND MSG="Layer {layer_i}/{layers} — Pass 1/4 (Horizontal TL → BR)"
    SPRAY_HORIZONTAL_TL_BR STEP={step} X_START={x_left} X_END={x_right} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={speed}
    G4 P{dry_time}
  
    # PASS 2
    {% set pass_i = base_pass + 2 %}
    SET_DISPLAY_PROGRESS PROGRESS={(pass_i-1)/total_passes}
    RESPOND MSG="Layer {layer_i}/{layers} — Pass 2/4 (Vertical TR → BL)"
    SPRAY_VERTICAL_TR_BL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={speed}
    G4 P{dry_time}
  
    # PASS 3
    {% set pass_i = base_pass + 3 %}
    SET_DISPLAY_PROGRESS PROGRESS={(pass_i-1)/total_passes}
    RESPOND MSG="Layer {layer_i}/{layers} — Pass 3/4 (Horizontal BR → TL)"
    SPRAY_HORIZONTAL_BR_TL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={speed}
    G4 P{dry_time}
  
    # PASS 4
    {% set pass_i = base_pass + 4 %}
    SET_DISPLAY_PROGRESS PROGRESS={(pass_i-1)/total_passes}
    RESPOND MSG="Layer {layer_i}/{layers} — Pass 4/4 (Vertical BL → TR)"
    SPRAY_VERTICAL_BL_TR STEP={step} X_START={x_left} X_END={x_right} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={speed}
    G4 P{dry_time}
  
  {% endfor %}
     
     M106 S0

     G90
     G1 X130 Y-110 Z75 F3000
     SET_DISPLAY_PROGRESS PROGRESS=1
     RESPOND MSG="Spray run complete."
  {% endif %}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


;Pass #1 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_TL_BR]
description: Single pass horizontal spray from top left to bottom right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %} 
  {% set Y_START = params.Y_START|default(22)|int %}   
  {% set Y_END = params.Y_END|default(0)|int %}    
  {% set SPEED = params.SPEED|default(3000)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  M106 S0
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = (range_max + range_min - y) %}
    M106 S255
     G1 X{X_START} Y{ypos} Z{Z} F{SPEED}     #line1
     G1 X{X_END} Y{ypos} Z{Z} F{SPEED}       #line2
     G1 X{X_END} Y{ypos-STEP} Z{Z} F{SPEED}  #line3
     G1 X{X_START} Y{ypos-STEP} Z{Z} F{SPEED} #line4
     G1 X{X_START} Y{ypos-STEP-STEP} Z{Z} F{SPEED} #line5    
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED}
  M106 S0

;Pass #2 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_BR_TL]
description: Single pass horizontal spray from bottom right to top left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %} 
  {% set Y_START = params.Y_START|default(0)|int %}   
  {% set Y_END = params.Y_END|default(22)|int %}    
  {% set SPEED = params.SPEED|default(3000)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  M106 S0
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = y %}
    M106 S255
     G1 X{X_START} Y{ypos} Z{Z} F{SPEED}
     G1 X{X_END} Y{ypos} Z{Z} F{SPEED}
     G1 X{X_END} Y{ypos+STEP} Z{Z} F{SPEED}
     G1 X{X_START} Y{ypos+STEP} Z{Z} F{SPEED}
     G1 X{X_START} Y{ypos+STEP+STEP} Z{Z} F{SPEED}     
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED}
  M106 S0

;Pass #3 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_TR_BL]
description: Single pass vertical spray from top right to bottom left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %} 
  {% set Y_START = params.Y_START|default(22)|int %}   
  {% set Y_END = params.Y_END|default(0)|int %}    
  {% set SPEED = params.SPEED|default(3000)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  M106 S0
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED}
  {% for x in range(range_min, range_max, STEP*2) %}
    {% set xpos = (range_max + range_min - x) %}
    M106 S255
    G1 X{xpos} Y{Y_START} Z{Z} F{SPEED}
    G1 X{xpos} Y{Y_END} Z{Z} F{SPEED}
    G1 X{xpos-STEP} Y{Y_END} Z{Z} F{SPEED}
    G1 X{xpos-STEP} Y{Y_START} Z{Z} F{SPEED}
    G1 X{xpos-STEP-STEP} Y{Y_START} Z{Z} F{SPEED}
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED}
  M106 S0

;Pass #4 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_BL_TR]
description: Single pass vertical spray from bottom left to top right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %} 
  {% set Y_START = params.Y_START|default(0)|int %}   
  {% set Y_END = params.Y_END|default(22)|int %}    
  {% set SPEED = params.SPEED|default(3000)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  M106 S0
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED}
  {% for x in range(range_min, range_max, STEP*2) %}
    {% set xpos = x %}
    M106 S255
    G1 X{xpos} Y{Y_START} Z{Z} F{SPEED}
    G1 X{xpos} Y{Y_END} Z{Z} F{SPEED}
    G1 X{xpos+STEP} Y{Y_END} Z{Z} F{SPEED}
    G1 X{xpos+STEP} Y{Y_START} Z{Z} F{SPEED}
    G1 X{xpos+STEP+STEP} Y{Y_START} Z{Z} F{SPEED}
  {% endfor %}
    G1 X{X_END} Y{Y_END} Z{Z} F{SPEED}
  M106 S0