############################################################
# SPRAY_STATE — shared runtime state for the spray job loop
############################################################
[gcode_macro SPRAY_STATE]
description: Shared state for spray job loop controller
variable_stop_requested: 0
variable_pause_requested: 0
variable_job_active: 0
variable_current_pass: 0
variable_total_passes: 4
variable_step: 1
variable_dry_time: 2000
variable_z: 25
variable_x_left: 0
variable_x_right: 22
variable_y_bottom: 0
variable_y_top: 22
variable_speed: 50
variable_edge_speed_mult: 1.5
variable_job_type: 0
variable_stripe_index: 0
variable_stripe_count: 0
variable_pass_orientation: 0
variable_pass_reverse: 0
variable_pass_x_start: 0
variable_pass_x_end: 0
variable_pass_y_start: 0
variable_pass_y_end: 0
variable_pass_range_min: 0
variable_pass_range_max: 0
variable_stripe_duration: 0.1
variable_final_move_duration: 0.1
variable_setup_duration: 0.1
gcode:
  RESPOND MSG="job_active={printer['gcode_macro SPRAY_STATE'].job_active} pass={printer['gcode_macro SPRAY_STATE'].current_pass}/{printer['gcode_macro SPRAY_STATE'].total_passes} stop_requested={printer['gcode_macro SPRAY_STATE'].stop_requested} paused={printer['gcode_macro SPRAY_STATE'].pause_requested}"


############################################################
# SPRAY_JOB_NEXT_PASS — paced controller
# Dispatches one unit per delayed_gcode tick (pass setup, one stripe,
# or completion) so pause/stop flags are re-read between units instead
# of being buried inside one uninterruptible per-pass macro burst.
# The 8 pass macros below remain intact for direct/calibration use.
############################################################
[gcode_macro SPRAY_JOB_NEXT_PASS]
description: Dispatch one paced spray setup, stripe, or completion unit
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% set cp = s.current_pass|int %}
  {% set tp = s.total_passes|int %}
  {% set step = s.step|int %}
  {% set speed = s.speed|float %}
  {% if s.stop_requested == 1 and s.job_active == 1 %}
    SET_PIN PIN=fan0 VALUE=0.00
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
    RESPOND MSG="Spray stopped after {cp}/{tp} passes"
  {% elif s.job_active == 0 %}
    # Stale tick with no active job: do nothing and do not reschedule.
  {% elif s.pause_requested == 1 %}
    RESPOND MSG="Spray paused at pass {cp}/{tp}"
  {% elif cp >= tp %}
    SET_PIN PIN=fan0 VALUE=0.00
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    RESPOND MSG="Spray run complete"
    G90
    G1 Z25 F3000
    SMART_MOVE X=0 Y=0
    MOVE_TO_INK_FILL_POSITION
  {% elif step <= 0 or speed <= 0 %}
    SET_PIN PIN=fan0 VALUE=0.00
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    RESPOND TYPE=error MSG="Spray STEP and SPEED must be greater than zero"
  {% elif s.stripe_count == -1 %}
    # A zero-width pass has no stripes; advance without re-entering setup forever.
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_pass VALUE={cp + 1}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_count VALUE=0
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION={s.dry_time / 1000}
  {% elif s.stripe_count > 0 and s.stripe_index < s.stripe_count %}
    {% set i = s.stripe_index|int %}
    {% set x0 = s.pass_x_start|float %}{% set x1 = s.pass_x_end|float %}
    {% set y0 = s.pass_y_start|float %}{% set y1 = s.pass_y_end|float %}
    {% set rmin = s.pass_range_min|float %}{% set rmax = s.pass_range_max|float %}
    {% if s.pass_reverse == 0 %}
      {% set pos = rmax - (i * step * 2) %}{% set signed_step = -step %}
    {% else %}
      {% set pos = rmin + (i * step * 2) %}{% set signed_step = step %}
    {% endif %}
    {% if s.job_type == 1 %}
      SET_PIN PIN=fan0 VALUE=255.00
    {% endif %}
    {% if s.pass_orientation == 0 %}
      {% if s.job_type == 0 %}
        SPRAY_STRIPE_H XA={x0} XB={x1} Y1={pos} Y2={pos + signed_step} Y3={pos + 2 * signed_step} Z={s.z} F={speed * 60}
      {% else %}
        SPRAY_ZZ_STRIPE_H XA={x0} XB={x1} Y1={pos + signed_step} Y2={pos + 2 * signed_step} Z={s.z} F={speed * 60}
      {% endif %}
    {% else %}
      {% if s.job_type == 0 %}
        SPRAY_STRIPE_V YA={y0} YB={y1} X1={pos} X2={pos + signed_step} X3={pos + 2 * signed_step} Z={s.z} F={speed * 60}
      {% else %}
        SPRAY_ZZ_STRIPE_V YA={y0} YB={y1} X1={pos + signed_step} X2={pos + 2 * signed_step} Z={s.z} F={speed * 60}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_index VALUE={i + 1}
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION={s.stripe_duration}
  {% elif s.stripe_count > 0 %}
    SET_PIN PIN=fan0 VALUE=0.00
    G1 X{s.pass_x_end} Y{s.pass_y_end} Z{s.z} F{speed * 60}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_pass VALUE={cp + 1}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_count VALUE=0
    {% if cp + 1 >= tp %}
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
      RESPOND MSG="Spray run complete"
      G90
      G1 Z25 F3000
      SMART_MOVE X=0 Y=0
      MOVE_TO_INK_FILL_POSITION
    {% else %}
      UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION={s.final_move_duration + (s.dry_time / 1000)}
    {% endif %}
  {% else %}
    {% set p = cp % 4 %}
    {% set layer_i = (cp // 4) + 1 %}{% set layers = tp // 4 %}
    {% if s.job_type == 0 %}
      {% set xl = s.x_left|float %}{% set xr = s.x_right|float %}{% set yb = s.y_bottom|float %}{% set yt = s.y_top|float %}
    {% else %}
      {% set a = printer["gcode_macro SPRAY_AREA_DEFAULTS"] %}
      {% set xl = a.x_left|float %}{% set xr = a.x_right|float %}{% set yb = a.y_bottom|float %}{% set yt = a.y_top|float %}
    {% endif %}
    {% if p == 0 %}
      {% set orientation = 0 %}{% set reverse = 0 %}{% set x0 = xl %}{% set x1 = xr %}{% set y0 = yt %}{% set y1 = yb %}
    {% elif p == 1 %}
      {% set orientation = 1 %}{% set reverse = 0 %}{% set x0 = xr %}{% set x1 = xl %}{% set y0 = yt %}{% set y1 = yb %}
    {% elif p == 2 %}
      {% set orientation = 0 %}{% set reverse = 1 %}{% set x0 = xr %}{% set x1 = xl %}{% set y0 = yb %}{% set y1 = yt %}
    {% else %}
      {% set orientation = 1 %}{% set reverse = 1 %}{% set x0 = xl %}{% set x1 = xr %}{% set y0 = yb %}{% set y1 = yt %}
    {% endif %}
    {% if orientation == 0 %}
      {% set rmin = [y0, y1]|min %}{% set rmax = [y0, y1]|max %}{% set span = (x1 - x0)|abs %}
    {% else %}
      {% set rmin = [x0, x1]|min %}{% set rmax = [x0, x1]|max %}{% set span = (y1 - y0)|abs %}
    {% endif %}
    {% set count = range(rmin|int, rmax|int, step * 2)|length %}
    {% if s.job_type == 0 %}{% set stripe_path = 2 * span + 2 * step %}{% else %}{% set stripe_path = 2 * ((span * span + step * step) ** 0.5) %}{% endif %}
    {% set curx = printer.gcode_move.gcode_position[0]|float %}{% set cury = printer.gcode_move.gcode_position[1]|float %}
    {% set setup_path = ((x0-curx)**2 + (y0-cury)**2) ** 0.5 %}
    {% if s.job_type == 1 %}{% set setup_path = setup_path + span %}{% endif %}
    {% set final_path = (span * span + (2 * step) * (2 * step)) ** 0.5 %}
    RESPOND MSG="Layer {layer_i}/{layers} - Pass {p + 1}/4"
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_orientation VALUE={orientation}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_reverse VALUE={reverse}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_x_start VALUE={x0}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_x_end VALUE={x1}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_y_start VALUE={y0}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_y_end VALUE={y1}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_min VALUE={rmin}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pass_range_max VALUE={rmax}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_index VALUE=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_count VALUE={-1 if count == 0 else count}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_duration VALUE={(stripe_path / speed) * 1.2}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=final_move_duration VALUE={(final_path / speed) * 1.2}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=setup_duration VALUE={(setup_path / speed) * 1.2}
    SET_PIN PIN=fan0 VALUE=0.00
    G1 X{x0} Y{y0} Z{s.z} F{speed * 60}
    {% if s.job_type == 1 %}
      SET_PIN PIN=fan0 VALUE=255.00
      {% if orientation == 0 %}G1 X{x1} Y{y0} Z{s.z} F{speed * 60}{% else %}G1 X{x0} Y{y1} Z{s.z} F{speed * 60}{% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION={(setup_path / speed) * 1.2}
  {% endif %}

############################################################
# DELAYED LOOP FOR SPRAY JOB
############################################################
[delayed_gcode spray_job_loop]
gcode:
  SPRAY_JOB_NEXT_PASS


############################################################
# STOP
############################################################
[gcode_macro STOP]
description: Stop spray job within the current stripe (no park)
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.job_active == 1 %}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=1
    SET_PIN PIN=fan0 VALUE=0.00
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0.1
    RESPOND MSG="Spray stop requested - stopping within current stripe"
  {% else %}
    RESPOND MSG="No active spray job to stop"
  {% endif %}


############################################################
# PAUSE
############################################################
[gcode_macro PAUSE_SPRAY]
description: Pause spray job in place without changing Z height
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.job_active == 1 %}
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=1
    SET_PIN PIN=fan0 VALUE=0.00
    RESPOND MSG="Spray paused at pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No active spray job to pause"
  {% endif %}


############################################################
# STOP_RUN
############################################################
[gcode_macro STOP_RUN]
description: Immediately stop spray job mid-pass and move to ink fill position (cannot resume)
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.job_active == 1 %}
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=1
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=0
    SET_PIN PIN=fan0 VALUE=0.00
    G90
    G1 Z25 F3000
    MOVE_TO_INK_FILL_POSITION
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
    RESPOND MSG="Spray stopped at pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No active spray job to stop"
  {% endif %}


############################################################
# RESUME
############################################################
[gcode_macro RESUME_SPRAY]
description: Resume spray job from where it was paused
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.pause_requested == 1 %}
    SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
    UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0.1
    RESPOND MSG="Spray resumed from pass {s.current_pass}/{s.total_passes}"
  {% else %}
    RESPOND MSG="No paused spray job to resume"
  {% endif %}


############################################################
#main function that calls each pattern macro:

[gcode_macro RUN_SPRAY_JOB]
description: Run spray job. X_LEFT/X_RIGHT/Y_BOTTOM/Y_TOP default to stored spray area — run SPRAY_AREA_DEFAULTS to see current values.
gcode:
  {% set layers = params.LAYERS|default(1)|int %}        # count
  {% set step = params.STEP|default(1)|int %}            # mm
  {% set dry_time = params.DRY_TIME|default(2000)|int %} # ms
  {% set z = params.Z|default(25)|int %}                 # mm
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set x_left   = params.X_LEFT|int   if params.X_LEFT   is defined else _d.x_left|int %}   # mm
  {% set x_right  = params.X_RIGHT|int  if params.X_RIGHT  is defined else _d.x_right|int %}  # mm
  {% set y_bottom = params.Y_BOTTOM|int if params.Y_BOTTOM is defined else _d.y_bottom|int %}  # mm
  {% set y_top    = params.Y_TOP|int    if params.Y_TOP    is defined else _d.y_top|int %}     # mm
  {% set SPEED = params.SPEED|default(50)|int %}         # mm/s
  {% set LASER_ALIGNMENT_STATUS = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if LASER_ALIGNMENT_STATUS == 0 %}
     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."
  {% else %}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stop_requested VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=pause_requested VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_active VALUE=1
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=current_pass VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_index VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=stripe_count VALUE=0
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=total_passes VALUE={layers * 4}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=step VALUE={step}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=dry_time VALUE={dry_time}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=z VALUE={z}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=x_left VALUE={x_left}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=x_right VALUE={x_right}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=y_bottom VALUE={y_bottom}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=y_top VALUE={y_top}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=speed VALUE={SPEED}
     SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=job_type VALUE=0
     G90
     G1 Z{z} F1200
     G1 X{x_left} Y{y_top} F{SPEED * 60}
     UPDATE_DELAYED_GCODE ID=spray_job_loop DURATION=0.1
  {% endif %}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


############################################################
# Per-stripe helpers — re-read pause/stop at dispatch time
# Helpers are unconditional motion primitives. The paced controller checks
# interruption before dispatch; direct and calibration macros use them as-is.
############################################################

[gcode_macro SPRAY_STRIPE_H]
description: Spray one horizontal stripe
gcode:
  SET_PIN PIN=fan0 VALUE=1.00
  G1 X{params.XA|float} Y{params.Y1|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.XB|float} Y{params.Y1|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.XB|float} Y{params.Y2|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.XA|float} Y{params.Y2|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.XA|float} Y{params.Y3|float} Z{params.Z|float} F{params.F|float}

[gcode_macro SPRAY_STRIPE_V]
description: Spray one vertical stripe
gcode:
  SET_PIN PIN=fan0 VALUE=1.00
  G1 X{params.X1|float} Y{params.YA|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.X1|float} Y{params.YB|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.X2|float} Y{params.YB|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.X2|float} Y{params.YA|float} Z{params.Z|float} F{params.F|float}
  G1 X{params.X3|float} Y{params.YA|float} Z{params.Z|float} F{params.F|float}


;Pass #1 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_TL_BR]
description: Single pass horizontal spray from top left to bottom right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %}
  {% set Y_START = params.Y_START|default(22)|int %}
  {% set Y_END = params.Y_END|default(0)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = (range_max + range_min - y) %}
    SPRAY_STRIPE_H XA={X_START} XB={X_END} Y1={ypos} Y2={ypos-STEP} Y3={ypos-STEP-STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=0.00

;Pass #2 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_HORIZONTAL_BR_TL]
description: Single pass horizontal spray from bottom right to top left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %}
  {% set Y_START = params.Y_START|default(0)|int %}
  {% set Y_END = params.Y_END|default(22)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = y %}
    SPRAY_STRIPE_H XA={X_START} XB={X_END} Y1={ypos} Y2={ypos+STEP} Y3={ypos+STEP+STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=0.00

;Pass #3 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_TR_BL]
description: Single pass vertical spray from top right to bottom left
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(22)|int %}
  {% set X_END = params.X_END|default(0)|int %}
  {% set Y_START = params.Y_START|default(22)|int %}
  {% set Y_END = params.Y_END|default(0)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for x in range(range_min, range_max, STEP*2) %}
    {% set xpos = (range_max + range_min - x) %}
    SPRAY_STRIPE_V YA={Y_START} YB={Y_END} X1={xpos} X2={xpos-STEP} X3={xpos-STEP-STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=0.00

;Pass #4 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_VERTICAL_BL_TR]
description: Single pass vertical spray from bottom left to top right
gcode:
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|default(0)|int %}
  {% set X_END = params.X_END|default(22)|int %}
  {% set Y_START = params.Y_START|default(0)|int %}
  {% set Y_END = params.Y_END|default(22)|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for x in range(range_min, range_max, STEP*2) %}
    {% set xpos = x %}
    SPRAY_STRIPE_V YA={Y_START} YB={Y_END} X1={xpos} X2={xpos+STEP} X3={xpos+STEP+STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=0.00
