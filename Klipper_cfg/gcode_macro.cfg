############################################################
# STARTUP: Restore homing state and laser alignment on restart
############################################################
[delayed_gcode restore_state_on_startup]
initial_duration: 1

gcode:
  {% set svv = printer.save_variables.variables %}

  # Restore homing state if available
  {% if svv.homed_x is defined and svv.homed_x == 1 %}
    RESPOND MSG="Restoring homed X state"
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0
  {% endif %}

  # Restore laser alignment data if available
  {% if svv.laser_alignment_complete is defined and svv.laser_alignment_complete == 1 %}
    RESPOND MSG="Restoring laser alignment state"
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_alignment_complete VALUE=1
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=offset_x VALUE={svv.laser_offset_x|float}
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=offset_y VALUE={svv.laser_offset_y|float}
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_x_pos VALUE={svv.laser_x_pos|float}
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=laser_y_pos VALUE={svv.laser_y_pos|float}
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=previous_bl_x VALUE={svv.previous_bl_x|float}
    SET_GCODE_VARIABLE MACRO=LASER_ALIGNMENT_FROM_BL_CORNER VARIABLE=previous_bl_y VALUE={svv.previous_bl_y|float}

    # Restore spray area defaults
    SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=x_left VALUE={svv.spray_x_left|float}
    SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=x_right VALUE={svv.spray_x_right|float}
    SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=y_bottom VALUE={svv.spray_y_bottom|float}
    SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=y_top VALUE={svv.spray_y_top|float}

    # Restore laser calibration data if available
    {% if svv.laser_offset_calibrated is defined and svv.laser_offset_calibrated == 1 %}
      SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_offset_x VALUE={svv.calibrated_laser_offset_x|float}
      SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_offset_y VALUE={svv.calibrated_laser_offset_y|float}
      SET_GCODE_VARIABLE MACRO=LASER_OFFSET_CAL_STEP_TWO_LASER_TO_SAME_POINT VARIABLE=laser_cal_step_two_status VALUE=1
    {% endif %}

    RESPOND MSG="State restored successfully"
  {% endif %}

  # Then restore origin after state is set
  UPDATE_DELAYED_GCODE ID=restore_spray_origin_startup DURATION=2
