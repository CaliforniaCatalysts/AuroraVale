[gcode_macro MOVE_TO_INK_FILL_POSITION]
description: Move to ink fill position using stored physical coordinates, corrected for laser alignment offset
variable_phys_x: 164
variable_phys_y: 10
variable_phys_z: 100
gcode:
  {% set phys_x = printer["gcode_macro MOVE_TO_INK_FILL_POSITION"].phys_x %}
  {% set phys_y = printer["gcode_macro MOVE_TO_INK_FILL_POSITION"].phys_y %}
  {% set phys_z = printer["gcode_macro MOVE_TO_INK_FILL_POSITION"].phys_z %}
  {% set offset_x = printer.gcode_move.gcode_position.x - printer.toolhead.position.x %}
  {% set offset_y = printer.gcode_move.gcode_position.y - printer.toolhead.position.y %}
  G90
  G1 X{phys_x + offset_x} Y{phys_y + offset_y} Z{phys_z} F5000

[gcode_macro MOVE_TO_BL_SPRAY_POSITION]
gcode:
  G90
  G1 X0 Y0 Z15 F5000


############################################################
# MOVE_TO_SPRAY_BL_CORNER
############################################################
[gcode_macro MOVE_TO_SPRAY_BL_CORNER]
description: Move to spray bottom-left corner (machine 0,0) with conditional Z lift
gcode:

  {% set align_done = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}

  {% if align_done == 0 %}

     RESPOND MSG="Laser alignment not completed. Run LASER_ALIGNMENT_FROM_BL_CORNER first."

  {% else %}
     # Move to safe height before XY travel
     G90
     RESPOND MSG="Moving to nozzle BL corner (0,0)"
     SMART_MOVE X=0 Y=0

  {% endif %}


