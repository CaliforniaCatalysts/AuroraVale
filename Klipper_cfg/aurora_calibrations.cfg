[gcode_macro ADJUST_SPRAY_AREA]
description: Add or subtract mm offset to each spray area edge independently
# X_LEFT_OFFSET: offset added to left boundary  (positive = shift right / shrink, negative = shift left / expand)
# X_RIGHT_OFFSET: offset added to right boundary (positive = shift right / expand, negative = shift left / shrink)
# Y_BOTTOM_OFFSET: offset added to bottom boundary (positive = shift up / shrink, negative = shift down / expand)
# Y_TOP_OFFSET: offset added to top boundary (positive = shift up / expand, negative = shift down / shrink)
# Usage: ADJUST_SPRAY_AREA X_LEFT_OFFSET=0 X_RIGHT_OFFSET=2 Y_BOTTOM_OFFSET=0 Y_TOP_OFFSET=-1
gcode:
  {% set dx_left   = params.X_LEFT_OFFSET|default(0)|float %}   # mm
  {% set dx_right  = params.X_RIGHT_OFFSET|default(0)|float %}  # mm
  {% set dy_bottom = params.Y_BOTTOM_OFFSET|default(0)|float %} # mm
  {% set dy_top    = params.Y_TOP_OFFSET|default(0)|float %}    # mm

  {% set cur_x_left   = printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_left|float %}
  {% set cur_x_right  = printer['gcode_macro SPRAY_AREA_DEFAULTS'].x_right|float %}
  {% set cur_y_bottom = printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_bottom|float %}
  {% set cur_y_top    = printer['gcode_macro SPRAY_AREA_DEFAULTS'].y_top|float %}

  {% set new_x_left   = cur_x_left   + dx_left %}
  {% set new_x_right  = cur_x_right  + dx_right %}
  {% set new_y_bottom = cur_y_bottom + dy_bottom %}
  {% set new_y_top    = cur_y_top    + dy_top %}

  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=x_left   VALUE={new_x_left}
  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=x_right  VALUE={new_x_right}
  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=y_bottom VALUE={new_y_bottom}
  SET_GCODE_VARIABLE MACRO=SPRAY_AREA_DEFAULTS VARIABLE=y_top    VALUE={new_y_top}

  SET_GCODE_VARIABLE MACRO=LASER_AREA_SCAN_EDGES VARIABLE=area_x VALUE={new_x_right - new_x_left}
  SET_GCODE_VARIABLE MACRO=LASER_AREA_SCAN_EDGES VARIABLE=area_y VALUE={new_y_top - new_y_bottom}

  RESPOND MSG="Spray area updated: X{new_x_left} to X{new_x_right}, Y{new_y_bottom} to Y{new_y_top}"


[gcode_macro SPRAY_LINE_TEST]
description: spray non-overlapping path the length of a full normal pass 360mm
gcode:
  {% set step = params.STEP|default(10)|int %}           # mm
  {% set z = params.Z|default(25)|int %}                 # mm
  {% set dry_time = params.DRY_TIME|default(5000)|int %} # ms
  {% set x_left = params.X_LEFT|default(10)|int %}       # mm
  {% set y_bottom = params.Y_BOTTOM|default(80)|int %}   # mm
  {% set x_right = params.X_RIGHT|default(140)|int %}    # mm
  {% set y_top = params.Y_TOP|default(160)|int %}        # mm
  {% set SPEED = params.SPEED|default(133)|int %}        # mm/s
  
 {% if LASER_ALIGNMENT_STATUS == 1 %}
     G28 X Y
     {% set LASER_ALIGNMENT_STATUS = 0 %}
 {% endif %}   
     
     G90
     G1 Z{z} F1200
     G1 X{x_left} Y{y_top} F{SPEED * 60} ;starting position at TL
  
      M106 S0
      G1 X{x_left} Y{y_top} Z{z} F{SPEED * 60}
      
      {% for y in range(y_bottom, y_top, step*2) %}
        {% set ypos = (y_top + y_bottom - y) %}
        M106 S255
         G4 P{dry_time / 2}
         G1 X{x_left} Y{ypos} Z{z} F{SPEED * 60}      ;
         G1 X{x_right} Y{ypos} Z{z} F{SPEED * 60}          ;
         G1 X{x_right} Y{ypos-step} Z{z} F{SPEED * 60}     ;
         G1 X{x_left} Y{ypos-step} Z{z} F{SPEED * 60}      ;
        M106 S0
        G4 P{dry_time / 2}  
        G1 X{x_left} Y{ypos-step-step} Z{z} F{SPEED * 60}      ;
        G4 P{dry_time / 2} 
         
         
      {% endfor %}
      M106 S0
    
     G1 Z75 F3000
     RESPOND MSG="Spray line test complete."


[gcode_macro SPRAY_PATTERN_TEST_NONOVERLAPPING]
description: test the spray pattern without overlapping passes
gcode:
  {% set layers = params.LAYERS|default(1)|int %}        # count
  {% set step = params.STEP|default(2)|int %}            # mm
  {% set z = params.Z|default(25)|int %}                 # mm
  {% set dry_time = params.DRY_TIME|default(5000)|int %} # ms
  {% set x_left = params.X_LEFT|default(0)|int %}        # mm
  {% set y_bottom = params.Y_BOTTOM|default(0)|int %}    # mm
  {% set x_right = params.X_RIGHT|default(22)|int %}     # mm
  {% set y_top = params.Y_TOP|default(22)|int %}         # mm
  {% set SPEED = params.SPEED|default(133)|int %}        # mm/s
  {% set gap = 20|int %}
  {% set spray_dist = 22|int %}
  {% set offset = gap + spray_dist|int %}
  {% set LASER_ALIGNMENT_STATUS = printer["gcode_macro LASER_ALIGNMENT_FROM_BL_CORNER"].laser_alignment_complete %}


    {% if LASER_ALIGNMENT_STATUS == 1 %}
         G28 X Y
         {% set LASER_ALIGNMENT_STATUS = 0 %}
     {% endif %}   

     G1 X30 Y145 Z{z} F{SPEED * 60}
     G92 Z{z} ;new (0,0) from step1 BL
     G90 ;absolute positioning for future moves

    {% for layer in range(layers) %}
        {% set layer_i = layer + 1 %}
        M118 Running spray layer {layer_i}/{layers}

        #step1 horiz TL-BR (no offset)
        SPRAY_HORIZONTAL_TL_BR STEP={step} X_START={x_left} X_END={x_right} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={SPEED}
        G4 P{dry_time}

        #step2 vert TR-BL (X-axis offset right)
        SPRAY_VERTICAL_TR_BL STEP={step} X_START={x_right+offset} X_END={x_left+offset} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={SPEED}
        G4 P{dry_time}

        #step3 horiz BR-TL (x-axis offset right and y-axis offset down)
        SPRAY_HORIZONTAL_BR_TL STEP={step} X_START={x_right+offset} X_END={x_left+offset} Y_START={y_bottom-offset} Y_END={y_top-offset} Z={z} SPEED={SPEED}
        G4 P{dry_time}

        #step4 vert BL-TR (y-axis offset down)
        SPRAY_VERTICAL_BL_TR STEP={step} X_START={x_left} X_END={x_right} Y_START={y_bottom-offset} Y_END={y_top-offset} Z={z} SPEED={SPEED}
        G4 P{dry_time}
     {% endfor %}
     
     M106 S0

     G90
     G1 Z75 F3000
     RESPOND MSG="Spray pattern test complete."

