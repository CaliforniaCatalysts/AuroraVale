############################################################
# Per-stripe helpers for zigzag passes — re-read pause/stop
# at dispatch time. Spray is turned on before the loop and
# stays on across stripes; the helper turns it off if a
# stop/pause flag is detected.
############################################################

[gcode_macro SPRAY_ZZ_STRIPE_H]
description: One zigzag horizontal stripe step; checks pause/stop when dispatched
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.pause_requested == 0 and s.stop_requested == 0 %}
    G1 X{params.XA|float} Y{params.Y1|float} Z{params.Z|float} F{params.F|float}
    G1 X{params.XB|float} Y{params.Y2|float} Z{params.Z|float} F{params.F|float}
  {% else %}
    SET_PIN PIN=fan0 VALUE=0.00
  {% endif %}

[gcode_macro SPRAY_ZZ_STRIPE_V]
description: One zigzag vertical stripe step; checks pause/stop when dispatched
gcode:
  {% set s = printer["gcode_macro SPRAY_STATE"] %}
  {% if s.pause_requested == 0 and s.stop_requested == 0 %}
    G1 X{params.X1|float} Y{params.YA|float} Z{params.Z|float} F{params.F|float}
    G1 X{params.X2|float} Y{params.YB|float} Z{params.Z|float} F{params.F|float}
  {% else %}
    SET_PIN PIN=fan0 VALUE=0.00
  {% endif %}


;Pass #1 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_ZZ_HORIZONTAL_TL_BR]
description: Single pass horizontal spray from top left to bottom right
gcode:
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|int if params.X_START is defined else _d.x_left|int %}
  {% set X_END   = params.X_END|int   if params.X_END   is defined else _d.x_right|int %}
  {% set Y_START = params.Y_START|int if params.Y_START is defined else _d.y_top|int %}
  {% set Y_END   = params.Y_END|int   if params.Y_END   is defined else _d.y_bottom|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=255.00
  G1 X{X_END} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = (range_max + range_min - y) %}
    SPRAY_ZZ_STRIPE_H XA={X_START} XB={X_END} Y1={ypos-STEP} Y2={ypos-STEP-STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}

;Pass #2 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_ZZ_HORIZONTAL_BR_TL]
description: Single pass horizontal spray from bottom right to top left
gcode:
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|int if params.X_START is defined else _d.x_right|int %}
  {% set X_END   = params.X_END|int   if params.X_END   is defined else _d.x_left|int %}
  {% set Y_START = params.Y_START|int if params.Y_START is defined else _d.y_bottom|int %}
  {% set Y_END   = params.Y_END|int   if params.Y_END   is defined else _d.y_top|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=255.00
  G1 X{X_END} Y{Y_START} Z{Z} F{SPEED * 60}
  {% for y in range(range_min, range_max, STEP*2) %}
    {% set ypos = y %}
    SPRAY_ZZ_STRIPE_H XA={X_START} XB={X_END} Y1={ypos+STEP} Y2={ypos+STEP+STEP} Z={Z} F={SPEED * 60}
  {% endfor %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}

;Pass #3 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_ZZ_VERTICAL_TR_BL]
description: Single pass vertical spray from top right to bottom left
gcode:
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|int if params.X_START is defined else _d.x_right|int %}
  {% set X_END   = params.X_END|int   if params.X_END   is defined else _d.x_left|int %}
  {% set Y_START = params.Y_START|int if params.Y_START is defined else _d.y_top|int %}
  {% set Y_END   = params.Y_END|int   if params.Y_END   is defined else _d.y_bottom|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=255.00
  G1 X{X_START} Y{Y_END} Z{Z} F{SPEED * 60}
  {% for x in range(range_min, range_max, STEP*2) %}
    {% set xpos = (range_max + range_min - x) %}
    SPRAY_ZZ_STRIPE_V X1={xpos-STEP} X2={xpos-STEP-STEP} YA={Y_START} YB={Y_END} Z={Z} F={SPEED * 60}
  {% endfor %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_END} Y{Y_END} Z{Z} F{SPEED * 60}

;Pass #4 of 4 in each layer of RUN_SPRAY_JOB
[gcode_macro SPRAY_ZZ_VERTICAL_BL_TR]
description: Single pass vertical spray from bottom left to top right
gcode:
  {% set _d = printer['gcode_macro SPRAY_AREA_DEFAULTS'] %}
  {% set STEP = params.STEP|default(1)|int %}
  {% set Z = params.Z|default(25)|int %}
  {% set X_START = params.X_START|int if params.X_START is defined else _d.x_left|int %}
  {% set X_END   = params.X_END|int   if params.X_END   is defined else _d.x_right|int %}
  {% set Y_START = params.Y_START|int if params.Y_START is defined else _d.y_bottom|int %}
  {% set Y_END   = params.Y_END|int   if params.Y_END   is defined else _d.y_top|int %}
  {% set SPEED = params.SPEED|default(50)|int %}
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  SET_PIN PIN=fan0 VALUE=0.00
  G1 X{X_START} Y{Y_START} Z{Z} F{SPEED * 60}
  SET_PIN PIN=fan0 VALUE=255.00
  G1 X{X_START} Y{Y_END} Z{Z} F{SPEED * 60}
