[gcode_macro RUN_SPRAY_JOB]
description: spray CCM
gcode:
  {% set layers = params.LAYERS|default(1)|int %}        # count
  {% set step = params.STEP|default(2)|int %}            # mm
  {% set z = params.Z|default(35)|int %}                 # mm
  {% set dry_time = params.DRY_TIME|default(5000)|int %} # ms

  {% set x_left = params.X_LEFT|default(85)|int %}       # mm
  {% set y_bottom = params.Y_BOTTOM|default(90)|int %}   # mm
  {% set x_right = params.X_RIGHT|default(115)|int %}    # mm
  {% set y_top = params.Y_TOP|default(120)|int %}        # mm

  {% set SPEED = params.SPEED|default(133)|int %}        # mm/s

  G1 Z{z} F1200
  G1 X{x_left} Y{y_top} F{SPEED * 60}

 {% for layer in range(layers) %}
    {% set layer_i = layer + 1 %}
    M118 current layer: {layer_i}

    SPRAY_HORIZONTAL STEP={step} X_START={x_left} X_END={x_right} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={SPEED}  
    G4 P{dry_time}

    SPRAY_VERTICAL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={SPEED}   
    G4 P{dry_time}

    SPRAY_HORIZONTAL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={SPEED} 
    G4 P{dry_time}

    SPRAY_VERTICAL STEP={step} X_START={x_left} X_END={x_right} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={SPEED}  
    G4 P{dry_time}

 {% endfor %}
 
 M106 S0
 M118 [RUN_SPRAY_JOB] Completed
 G1 X160 Y45 Z100 F1200


[gcode_macro SPRAY_HORIZONTAL]
gcode:
  {% set Y_START = params.Y_START|int %}  # mm
  {% set Y_END = params.Y_END|int %}      # mm
  {% set STEP = params.STEP|int %}        # mm
  {% set X_START = params.X_START|int %}  # mm
  {% set X_END = params.X_END|int %}      # mm
  {% set Z = params.Z|default(35)|int %}  # mm
  {% set SPEED = params.SPEED|default(133)|int %}  # mm/s
  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}

  {% for y in range(range_min, range_max, STEP) %}
    {% if Y_START < Y_END %}
      {% set ypos = y %}
    {% else %}
      {% set ypos = (range_max + range_min - y) %}
    {% endif %}
    M106 S255
    G1 X{X_START} Y{ypos} Z{Z} F{SPEED * 60}
    G1 X{X_END} Y{ypos} Z{Z} F{SPEED * 60}
  {% endfor %}
  M106 S0
  
[gcode_macro SPRAY_VERTICAL]
gcode:
  {% set X_START = params.X_START|int %}  # mm
  {% set X_END = params.X_END|int %}      # mm
  {% set STEP = params.STEP|int %}        # mm
  {% set Y_START = params.Y_START|int %}  # mm
  {% set Y_END = params.Y_END|int %}      # mm
  {% set Z = params.Z|default(35)|int %}  # mm
  {% set SPEED = params.SPEED|default(133)|int %}  # mm/s
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}

  {% for x in range(range_min, range_max, STEP) %}
    {% if X_START < X_END %}
      {% set xpos = x %}
    {% else %}
      {% set xpos = (range_max + range_min - x) %}
    {% endif %}
    M106 S255
    G1 X{xpos} Y{Y_START} Z{Z} F{SPEED * 60}
    G1 X{xpos} Y{Y_END} Z{Z} F{SPEED * 60}
  {% endfor %}
  M106 S0
  
