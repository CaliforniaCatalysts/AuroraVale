[gcode_macro RUN_SPRAY_JOB]
description: spray CCM
gcode:
  {% set layers = params.LAYERS|default(1)|int %}
  {% set step = params.STEP|default(2)|int %}
  {% set z = params.Z|default(35)|int %}
  {% set dry_time = params.DRY_TIME|default(5000)|int %}
  
  {% set x_left = params.X_LEFT|default(85)|int %}
  {% set y_bottom = params.Y_BOTTOM|default(90)|int %}
  {% set x_right = params.X_RIGHT|default(115)|int %}
  {% set y_top = params.Y_TOP|default(120)|int %}
  
  {% set speed = params.SPEED|default(8000)|int %}

  G1 Z{z} F1200
  G1 X{x_left} Y{y_top} F{speed}

 {% for layer in range(layers) %}
    {% set layer_i = layer + 1 %}
    M118 current layer: {layer_i}

    SPRAY_HORIZONTAL STEP={step} X_START={x_left} X_END={x_right} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={speed}  
    G4 P{dry_time}

    SPRAY_VERTICAL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_top} Y_END={y_bottom} Z={z} SPEED={speed}   
    G4 P{dry_time}

    SPRAY_HORIZONTAL STEP={step} X_START={x_right} X_END={x_left} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={speed} 
    G4 P{dry_time}

    SPRAY_VERTICAL STEP={step} X_START={x_left} X_END={x_right} Y_START={y_bottom} Y_END={y_top} Z={z} SPEED={speed}  
    G4 P{dry_time}

 {% endfor %}
 
 M106 S0
 M118 [RUN_SPRAY_JOB] Completed
 G1 X160 Y45 Z100 F1200


[gcode_macro SPRAY_HORIZONTAL]
gcode:
  {% set Y_START = params.Y_START|int %}   
  {% set Y_END = params.Y_END|int %}       
  {% set STEP = params.STEP|int %}
  {% set X_START = params.X_START|int %}
  {% set X_END = params.X_END|int %}
  {% set Z = params.Z|default(35)|int %}
  {% set SPEED = params.SPEED|default(8000)|int %}
  {% set direction = 1 %}

  {% set range_min = [Y_START, Y_END]|min %}
  {% set range_max = [Y_START, Y_END]|max %}
  
  {% for y in range(range_min, range_max, STEP) %}
    {% if Y_START < Y_END %}
      {% set ypos = y %}
    {% else %}
      {% set ypos = (range_max + range_min - y) %}
    {% endif %}
    M106 S255
    {% if direction == 1 %}
      G1 X{X_START} Y{ypos} Z{Z} F{SPEED}
      G1 X{X_END} Y{ypos} Z{Z} F{SPEED}
    {% else %}
      G1 X{X_END} Y{ypos} Z{Z} F{SPEED}
      G1 X{X_START} Y{ypos} Z{Z} F{SPEED}
    {% endif %}
    {% set direction = -direction %}
  {% endfor %}
  M106 S0
  
[gcode_macro SPRAY_VERTICAL]
gcode:
  {% set X_START = params.X_START|int %}
  {% set X_END = params.X_END|int %}
  {% set STEP = params.STEP|int %}
  {% set Y_START = params.Y_START|int %}
  {% set Y_END = params.Y_END|int %}
  {% set Z = params.Z|default(35)|int %}
  {% set SPEED = params.SPEED|default(8000)|int %}
  {% set direction = 1 %}
  
  {% set range_min = [X_START, X_END]|min %}
  {% set range_max = [X_START, X_END]|max %}
  
  {% for x in range(range_min, range_max, STEP) %}
    {% if X_START < X_END %}
      {% set xpos = x %}
    {% else %}
      {% set xpos = (range_max + range_min - x) %}
    {% endif %}    
    M106 S255
    
    {% if direction == 1 %}
      G1 X{xpos} Y{Y_START} Z{Z} F{SPEED}
      G1 X{xpos} Y{Y_END} Z{Z} F{SPEED}
    {% else %}
      G1 X{xpos} Y{Y_END} Z{Z} F{SPEED}
      G1 X{xpos} Y{Y_START} Z{Z} F{SPEED}
    {% endif %}
    {% set direction = -direction %}
  {% endfor %}
  M106 S0
  
