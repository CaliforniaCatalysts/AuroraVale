[gcode_macro RUN_SPRAY_JOB]
gcode:
  {% set layers = params.LAYERS|default(4)|int %}
  {% set step = params.STEP|default(1.0)|float %}
  {% set z = params.Z|default(100)|float %}
  {% set spray = params.SPRAY|default(255)|int %}
  {% set dry_time = params.DRY_TIME|default(25000)|int %}
  {% set x_start = params.X_START|default(77.28)|float %}
  {% set x_end = params.X_END|default(45.28)|float %}
  {% set y_start = params.Y_START|default(121.49)|float %}
  {% set y_end = params.Y_END|default(149.49)|float %}
  {% set feed = params.FEED|default(4800)|int %}

  G1 Z{z} F{feed}
  G1 X{x_start} Y{y_start} F{feed}

  {% for layer in range(layers) %}
    SPRAY_HORIZONTAL STEP={step} X_START={x_start} X_END={x_end} Y_START={y_start} Y_END={y_end} Z={z} FEED={feed} SPRAY={spray}
    SPRAY_VERTICAL STEP={step} X_START={x_start} X_END={x_end} Y_START={y_start} Y_END={y_end} Z={z} FEED={feed} SPRAY={spray}
    M106 S0
    G4 P{dry_time}
  {% endfor %}

  G1 Z{z} F{feed}
  G1 X0 Y0 F{feed}


[gcode_macro SPRAY_HORIZONTAL]
gcode:
  {% set Y_START = params.Y_START|float %}
  {% set Y_END = params.Y_END|float %}
  {% set STEP = params.STEP|float %}
  {% set X_START = params.X_START|float %}
  {% set X_END = params.X_END|float %}
  {% set Z = params.Z|default(100)|float %}
  {% set FEED = params.FEED|default(4800)|int %}
  {% set SPRAY = params.SPRAY|default(255)|int %}

  {% set direction = 1 %}
  {% for y in range((Y_START*100)|int, (Y_END*100+1)|int, (STEP*100)|int) %}
    {% set ypos = y / 100.0 %}
    M106 S{SPRAY}
    {% if direction == 1 %}
      G1 X{X_START} Y{ypos} Z{Z} F{FEED}
      G1 X{X_END} Y{ypos} Z{Z} F{FEED}
    {% else %}
      G1 X{X_END} Y{ypos} Z{Z} F{FEED}
      G1 X{X_START} Y{ypos} Z{Z} F{FEED}
    {% endif %}
    {% set direction = -direction %}
  {% endfor %}
  M106 S0


[gcode_macro SPRAY_VERTICAL]
gcode:
  {% set X_START = params.X_START|float %}
  {% set X_END = params.X_END|float %}
  {% set STEP = params.STEP|float %}
  {% set Y_START = params.Y_START|float %}
  {% set Y_END = params.Y_END|float %}
  {% set Z = params.Z|default(100)|float %}
  {% set FEED = params.FEED|default(4800)|int %}
  {% set SPRAY = params.SPRAY|default(255)|int %}

  {% set direction = 1 %}
  {% for x in range((X_START*100)|int, (X_END*100+1)|int, (STEP*100)|int) %}
    {% set xpos = x / 100.0 %}
    M106 S{SPRAY}
    {% if direction == 1 %}
      G1 X{xpos} Y{Y_START} Z{Z} F{FEED}
      G1 X{xpos} Y{Y_END} Z{Z} F{FEED}
    {% else %}
      G1 X{xpos} Y{Y_END} Z{Z} F{FEED}
      G1 X{xpos} Y{Y_START} Z{Z} F{FEED}
    {% endif %}
    {% set direction = -direction %}
  {% endfor %}
  M106 S0
