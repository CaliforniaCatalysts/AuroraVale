[gcode_macro RUN_SPRAY_JOB]
gcode:
  {% set layers   = params.LAYERS|default(4)|int %}
  {% set step     = params.STEP|default(4.0)|float %}
  {% set z        = params.Z|default(25)|float %}
  {% set spray    = params.SPRAY|default(255)|int %}
  {% set dry_time = params.DRY_TIME|default(25000)|int %}
  {% set x_start  = params.X_START|default(60.75)|float %}
  {% set x_end    = params.X_END|default(120.75)|float %}
  {% set y_start  = params.Y_START|default(35.25)|float %}
  {% set y_end    = params.Y_END|default(95.25)|float %}
  {% set feed     = params.FEED|default(4800)|int %}

  M106 S0
  G1 Z{z} F{feed}
  G1 X{x_start} Y{y_start} F{feed}

  {% for layer in range(0, layers) %}
    M106 S{spray}

    {% if layer % 2 == 0 %}
      SPRAY_HORIZONTAL X_START={x_start} X_END={x_end} Y_START={y_start} Y_END={y_end} STEP={step} Z={z} FEED={feed} SPRAY={spray}
    {% else %}
      SPRAY_VERTICAL X_START={x_start} X_END={x_end} Y_START={y_start} Y_END={y_end} STEP={step} Z={z} FEED={feed} SPRAY={spray}
    {% endif %}

    M106 S0
    G4 S={dry_time / 1000}
  {% endfor %}

  G1 Z100 F{feed}
  G1 X0 Y0 F{feed}


[gcode_macro SPRAY_HORIZONTAL]
gcode:
  {% set y_start = params.Y_START|float %}
  {% set y_end   = params.Y_END|float %}
  {% set step    = params.STEP|float %}
  {% set x_start = params.X_START|float %}
  {% set x_end   = params.X_END|float %}
  {% set z       = params.Z|float %}
  {% set feed    = params.FEED|int %}
  {% set spray   = params.SPRAY|int %}

  M106 S{spray}

  {% set y_current = y_start %}
  {% set forward = true %}
  {% while y_current <= y_end %}
    {% if forward %}
      G1 X{x_end} Y{y_current} Z{z} F{feed}
    {% else %}
      G1 X{x_start} Y{y_current} Z{z} F{feed}
    {% endif %}

    {% set y_current = y_current + step %}
    {% set forward = not forward %}

    {% if y_current <= y_end %}
      G1 Y{y_current} Z{z} F{feed}
    {% endif %}
  {% endwhile %}

  M106 S0


[gcode_macro SPRAY_VERTICAL]
gcode:
  {% set x_start = params.X_START|float %}
  {% set x_end   = params.X_END|float %}
  {% set step    = params.STEP|float %}
  {% set y_start = params.Y_START|float %}
  {% set y_end   = params.Y_END|float %}
  {% set z       = params.Z|float %}
  {% set feed    = params.FEED|int %}
  {% set spray   = params.SPRAY|int %}

  M106 S{spray}

  {% set x_current = x_start %}
  {% set forward = true %}
  {% while x_current <= x_end %}
    {% if forward %}
      G1 X{x_current} Y{y_end} Z{z} F{feed}
    {% else %}
      G1 X{x_current} Y{y_start} Z{z} F{feed}
    {% endif %}

    {% set x_current = x_current + step %}
    {% set forward = not forward %}

    {% if x_current <= x_end %}
      G1 X{x_current} Z{z} F{feed}
    {% endif %}
  {% endwhile %}

  M106 S0
