############################################################
# File: spray_job_macros.cfg
# Version: 1.4.0
# Author: Steven Jaffe-Lewis + M365 Copilot
# Created: 2025-11-17 22:12:21 GMT-08:00
#
# Purpose:
#   Spray rectangular areas using serpentine passes with 4-direction
#   coverage per layer, alignment-aware bounds, non-spraying corner
#   finish, and operator controls for pause/resume/stop + auto-park.
#
# Simple alignment workflow (jog & save):
#   1) Jog to BOTTOM-LEFT → SAVE_BL
#   2) Jog to TOP-RIGHT   → SAVE_TR
#   3) Optional           → PRINT_ALIGNMENT
#
# Controls:
#   SPRAY_PAUSE [LIFT=5.0] : Pause safely; sprayer OFF; auto-park to X11 Y54 Z100.
#   SPRAY_RESUME           : Resume; restore position; re-enable sprayer if it was on.
#   SPRAY_STOP             : Graceful stop (between passes); auto-park when safe.
#
# Requirements:
#   - Sprayer controlled via M106 (fan-style). If using another output,
#     wrap M106 in your own SPRAY_ON/SPRAY_OFF macros and swap calls.
############################################################


############################################################
# STATE & CONTROL
############################################################

[gcode_macro SPRAY_STATE]
description: Internal state for spray job control
variable_spraying: 0        # 0/1 - live spraying status set by pattern macros
variable_was_spraying: 0    # 0/1 - remembered at PAUSE time for RESUME
variable_abort: 0           # 0/1 - request graceful stop between passes
variable_pause_lift: 5.0    # default Z-lift on pause (mm)
# Auto-park location (requested): X11 Y54 Z100
variable_park_x: 11.0
variable_park_y: 54.0
variable_park_z: 100.0
gcode:

# Pause wrapper for spraying jobs: lifts, parks, and pauses
[gcode_macro SPRAY_PAUSE]
description: Pause spray job; sprayer OFF; lift, auto-park to X11 Y54 Z100; enter paused state
gcode:
  {% set lift = params.LIFT|default(printer["gcode_macro SPRAY_STATE"].pause_lift)|float %}
  {% set px = printer["gcode_macro SPRAY_STATE"].park_x %}
  {% set py = printer["gcode_macro SPRAY_STATE"].park_y %}
  {% set pz = printer["gcode_macro SPRAY_STATE"].park_z %}
  # Remember whether we were spraying at pause time
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=was_spraying VALUE={printer["gcode_macro SPRAY_STATE"].spraying|int}
  M118 [SPRAY_PAUSE] Pausing (lift={lift}mm) and parking to X{px} Y{py} Z{pz}...
  # Ensure sprayer off and mark state
  M106 S0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
  # Save motion state, lift, and auto-park
  SAVE_GCODE_STATE NAME=SPRAY_PAUSE_STATE
  G91
  G1 Z{lift} F1200
  G90
  G1 X{px} Y{py} Z{pz} F3000
  # Enter paused state (cooperates with your PAUSE macro if defined)
  PAUSE

# Resume wrapper: restore position and re-enable sprayer if needed
[gcode_macro SPRAY_RESUME]
description: Resume spray job; restore saved position; re-enable sprayer if it was on at pause
gcode:
  M118 [SPRAY_RESUME] Restoring position and resuming...
  # Exit paused state
  RESUME
  # Restore saved motion state (returns to where we paused)
  RESTORE_GCODE_STATE NAME=SPRAY_PAUSE_STATE MOVE=1
  # Re-enable sprayer only if it was active at pause time
  {% if printer["gcode_macro SPRAY_STATE"].was_spraying %}
    M106 S255
  {% endif %}

# Graceful stop: aborts between passes; sprayer OFF immediately
[gcode_macro SPRAY_STOP]
description: Request graceful stop for spray job (aborts at next safe point)
gcode:
  M118 [SPRAY_STOP] Stop requested — will abort at next safe point.
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=abort VALUE=1
  # Turn off sprayer now for safety; position will park when safe
  M106 S0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0


############################################################
# ALIGNMENT STORAGE AND UTILITIES
############################################################

[gcode_macro SETUP_ALIGNMENT]
description: Stores alignment bounds for spray area
variable_x_left: 10.0
variable_x_right: 190.0
variable_y_bottom: 10.0
variable_y_top: 180.0
gcode:
  M118 [SETUP_ALIGNMENT] Defaults: XL={x_left:.3f}, XR={x_right:.3f}, YB={y_bottom:.3f}, YT={y_top:.3f}

[gcode_macro SET_ALIGNMENT]
description: Set alignment bounds (X_LEFT, X_RIGHT, Y_BOTTOM, Y_TOP) with validation
gcode:
  {% set xl = params.X_LEFT|default(printer["gcode_macro SETUP_ALIGNMENT"].x_left)|float %}
  {% set xr = params.X_RIGHT|default(printer["gcode_macro SETUP_ALIGNMENT"].x_right)|float %}
  {% set yb = params.Y_BOTTOM|default(printer["gcode_macro SETUP_ALIGNMENT"].y_bottom)|float %}
  {% set yt = params.Y_TOP|default(printer["gcode_macro SETUP_ALIGNMENT"].y_top)|float %}

  {% set xmin = printer.toolhead.axis_minimum.x %}
  {% set xmax = printer.toolhead.axis_maximum.x %}
  {% set ymin = printer.toolhead.axis_minimum.y %}
  {% set ymax = printer.toolhead.axis_maximum.y %}

  {% if not (xmin <= xl <= xmax and xmin <= xr <= xmax and ymin <= yb <= ymax and ymin <= yt <= ymax) %}
    RESPOND TYPE=error MSG="SET_ALIGNMENT: Values out of machine range."
    {% exit %}
  {% endif %}
  {% if xl == xr or yb == yt %}
    RESPOND TYPE=error MSG="SET_ALIGNMENT: Degenerate rectangle (zero width or height)."
    {% exit %}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=x_left   VALUE={xl}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=x_right  VALUE={xr}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=y_bottom VALUE={yb}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=y_top    VALUE={yt}
  M118 [SET_ALIGNMENT] Set: XL={xl:.3f}, XR={xr:.3f}, YB={yb:.3f}, YT={yt:.3f}

[gcode_macro PRINT_ALIGNMENT]
description: Print current alignment bounds from SETUP_ALIGNMENT
gcode:
  {% set xl = printer["gcode_macro SETUP_ALIGNMENT"].x_left %}
  {% set xr = printer["gcode_macro SETUP_ALIGNMENT"].x_right %}
  {% set yb = printer["gcode_macro SETUP_ALIGNMENT"].y_bottom %}
  {% set yt = printer["gcode_macro SETUP_ALIGNMENT"].y_top %}
  M118 [PRINT_ALIGNMENT] XL={xl:.3f}, XR={xr:.3f}, YB={yb:.3f}, YT={yt:.3f}

# Jog-and-save helpers with confirmation beeps
[gcode_macro SAVE_BL]
description: Save current XY as Bottom-Left (x_left, y_bottom) with confirmation beep
gcode:
  {% set pos = printer.gcode_move.gcode_position %}
  {% set xl  = pos.x|float %}
  {% set yb  = pos.y|float %}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=x_left   VALUE={xl}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=y_bottom VALUE={yb}
  M118 [SAVE_BL] Stored BL → XL={xl:.3f}, YB={yb:.3f}
  M300 S880 P120
  PRINT_ALIGNMENT

[gcode_macro SAVE_TR]
description: Save current XY as Top-Right (x_right, y_top) with confirmation beeps
gcode:
  {% set pos = printer.gcode_move.gcode_position %}
  {% set xr  = pos.x|float %}
  {% set yt  = pos.y|float %}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=x_right VALUE={xr}
  SET_GCODE_VARIABLE MACRO=SETUP_ALIGNMENT VARIABLE=y_top   VALUE={yt}
  M118 [SAVE_TR] Stored TR → XR={xr:.3f}, YT={yt:.3f}
  M300 S880  P100
  G4  P80
  M300 S1760 P140
  PRINT_ALIGNMENT


############################################################
# SPRAY JOB MACROS
############################################################

[gcode_macro RUN_SPRAY_JOB]
description: Spray CCM with 4-step pattern per layer using alignment
gcode:
  {% set layers    = params.LAYERS|default(4)|int %}
  {% set step      = params.STEP|default(2.0)|float %}
  {% set z         = params.Z|default(35)|float %}
  {% set dry_time  = params.DRY_TIME|default(5000)|int %}
  {% set speed     = params.SPEED|default(8000)|int %}
  {% set px = printer["gcode_macro SPRAY_STATE"].park_x %}
  {% set py = printer["gcode_macro SPRAY_STATE"].park_y %}
  {% set pz = printer["gcode_macro SPRAY_STATE"].park_z %}

  # --- Validation ---
  {% if layers <= 0 %}
    RESPOND TYPE=error MSG="RUN_SPRAY_JOB: LAYERS must be > 0"
    {% exit %}
  {% endif %}
  {% if step <= 0 %}
    RESPOND TYPE=error MSG="RUN_SPRAY_JOB: STEP must be > 0"
    {% exit %}
  {% endif %}
  {% if speed <= 0 %}
    RESPOND TYPE=error MSG="RUN_SPRAY_JOB: SPEED must be > 0"
    {% exit %}
  {% endif %}

  # Pull alignment
  {% set x_left    = printer["gcode_macro SETUP_ALIGNMENT"].x_left %}
  {% set y_bottom  = printer["gcode_macro SETUP_ALIGNMENT"].y_bottom %}
  {% set x_right   = printer["gcode_macro SETUP_ALIGNMENT"].x_right %}
  {% set y_top     = printer["gcode_macro SETUP_ALIGNMENT"].y_top %}

  # Normalize rectangle
  {% if x_left > x_right %}
    {% set tmp = x_left %}{% set x_left = x_right %}{% set x_right = tmp %}
  {% endif %}
  {% if y_bottom > y_top %}
    {% set tmp = y_bottom %}{% set y_bottom = y_top %}{% set y_top = tmp %}
  {% endif %}

  # Reset state at start
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=abort VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=was_spraying VALUE=0

  # Move to safe height and starting corner
  G1 Z{z} F1200
  G1 X{x_left} Y{y_top} F{speed}

  {% for layer in range(layers) %}
    M118 [RUN_SPRAY_JOB] Layer {{ layer + 1 }} / {{ layers }}

    # Abort check (graceful stop between passes)
    {% if printer["gcode_macro SPRAY_STATE"].abort %}
      M118 [RUN_SPRAY_JOB] Aborted by user (before pass). Auto-parking...
      M106 S0
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
      G1 X{px} Y{py} Z{pz} F3000
      {% exit %}
    {% endif %}

    G1 F{speed}
    SPRAY_HORIZONTAL STEP={step} X_START={x_left}  X_END={x_right} Y_START={y_top}    Y_END={y_bottom}
    G4 P{dry_time}

    {% if printer["gcode_macro SPRAY_STATE"].abort %}
      M118 [RUN_SPRAY_JOB] Aborted by user. Auto-parking...
      M106 S0
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
      G1 X{px} Y{py} Z{pz} F3000
      {% exit %}
    {% endif %}

    G1 F{speed}
    SPRAY_VERTICAL   STEP={step} X_START={x_right} X_END={x_left}  Y_START={y_top}    Y_END={y_bottom}
    G4 P{dry_time}

    {% if printer["gcode_macro SPRAY_STATE"].abort %}
      M118 [RUN_SPRAY_JOB] Aborted by user. Auto-parking...
      M106 S0
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
      G1 X{px} Y{py} Z{pz} F3000
      {% exit %}
    {% endif %}

    G1 F{speed}
    SPRAY_HORIZONTAL STEP={step} X_START={x_right} X_END={x_left}  Y_START={y_bottom} Y_END={y_top}
    G4 P{dry_time}

    {% if printer["gcode_macro SPRAY_STATE"].abort %}
      M118 [RUN_SPRAY_JOB] Aborted by user. Auto-parking...
      M106 S0
      SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
      G1 X{px} Y{py} Z{pz} F3000
      {% exit %}
    {% endif %}

    G1 F{speed}
    SPRAY_VERTICAL   STEP={step} X_START={x_left}  X_END={x_right} Y_START={y_bottom} Y_END={y_top}
    G4 P{dry_time}
  {% endfor %}

  # Completion: ensure spray off and auto-park
  M106 S0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
  M118 [RUN_SPRAY_JOB] Completed — Auto-parking.
  G1 X{px} Y{py} Z{pz} F3000


[gcode_macro SPRAY_HORIZONTAL]
description: Horizontal spray pattern (serpentine; ends at opposite corner with non-spraying final move)
gcode:
  {% set Y_START = params.Y_START|float %}
  {% set Y_END   = params.Y_END|float %}
  {% set STEP    = params.STEP|float %}
  {% set X_START = params.X_START|float %}
  {% set X_END   = params.X_END|float %}

  {% if STEP <= 0 %}
    RESPOND TYPE=error MSG="SPRAY_HORIZONTAL: STEP must be > 0"
    {% exit %}
  {% endif %}

  # Build Y positions without overshoot; always include Y_END
  {% set ys = (Y_START*100)|int %}
  {% set ye = (Y_END*100)|int %}
  {% set st = (STEP*100)|int %}
  {% if st <= 0 %}{% set st = 1 %}{% endif %}
  {% set dir = 1 if ys <= ye else -1 %}
  {% set dist = (ye - ys)|abs %}
  {% set steps_full = dist // st %}
  {% set remainder  = dist % st %}
  {% set count = steps_full + (1 if remainder > 0 else 0) %}

  {% set positions = [] %}
  {% for i in range(0, count + 1) %}
    {% set y_i = ys + dir * (i * st) %}
    {% if (dir == 1 and y_i > ye) or (dir == -1 and y_i < ye) %}
      {% set y_i = ye %}
    {% endif %}
    {% set positions = positions + [ y_i / 100.0 ] %}
  {% endfor %}

  # Start spray and mark state
  M106 S255
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=1

  # Serpentine in pairs; step by 2 to avoid overlapping pairs
  {% for i in range(0, positions|length - 1, 2) %}
    G1 X{X_START} Y{{ positions[i]   }}
    G1 X{X_END}   Y{{ positions[i]   }}
    G1 X{X_END}   Y{{ positions[i+1] }}
    G1 X{X_START} Y{{ positions[i+1] }}

    # Keep deposition continuous on the return to the next row
    {% if i + 2 < positions|length %}
      G1 X{X_START} Y{{ positions[i+2] }}
    {% endif %}
  {% endfor %}

  # Handle odd leftover row (single pass left->right)
  {% if positions|length is odd %}
    G1 X{X_START} Y{{ positions[-1] }}
    G1 X{X_END}   Y{{ positions[-1] }}
  {% endif %}

  # Finish: turn spray OFF and mark state, then short non-spraying corner move
  M106 S0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
  G1 X{X_END} Y{Y_END}


[gcode_macro SPRAY_VERTICAL]
description: Vertical spray pattern (serpentine; ends at opposite corner with non-spraying final move)
gcode:
  {% set X_START = params.X_START|float %}
  {% set X_END   = params.X_END|float %}
  {% set STEP    = params.STEP|float %}
  {% set Y_START = params.Y_START|float %}
  {% set Y_END   = params.Y_END|float %}

  {% if STEP <= 0 %}
    RESPOND TYPE=error MSG="SPRAY_VERTICAL: STEP must be > 0"
    {% exit %}
  {% endif %}

  # Build X positions without overshoot; always include X_END
  {% set xs = (X_START*100)|int %}
  {% set xe = (X_END*100)|int %}
  {% set st = (STEP*100)|int %}
  {% if st <= 0 %}{% set st = 1 %}{% endif %}
  {% set dir = 1 if xs <= xe else -1 %}
  {% set dist = (xe - xs)|abs %}
  {% set steps_full = dist // st %}
  {% set remainder  = dist % st %}
  {% set count = steps_full + (1 if remainder > 0 else 0) %}

  {% set positions = [] %}
  {% for i in range(0, count + 1) %}
    {% set x_i = xs + dir * (i * st) %}
    {% if (dir == 1 and x_i > xe) or (dir == -1 and x_i < xe) %}
      {% set x_i = xe %}
    {% endif %}
    {% set positions = positions + [ x_i / 100.0 ] %}
  {% endfor %}

  # Start spray and mark state
  M106 S255
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=1

  # Serpentine in pairs; step by 2 to avoid overlapping pairs
  {% for i in range(0, positions|length - 1, 2) %}
    G1 X{{ positions[i]   }} Y{Y_START}
    G1 X{{ positions[i]   }} Y{Y_END}
    G1 X{{ positions[i+1] }} Y{Y_END}
    G1 X{{ positions[i+1] }} Y{Y_START}

    # Keep deposition continuous on the return to the next column
    {% if i + 2 < positions|length %}
      G1 X{{ positions[i+2] }} Y{Y_START}
    {% endif %}
  {% endfor %}

  # Handle odd leftover column (single pass top->bottom)
  {% if positions|length is odd %}
    G1 X{{ positions[-1] }} Y{Y_START}
    G1 X{{ positions[-1] }} Y{Y_END}
  {% endif %}

  # Finish: turn spray OFF and mark state, then short non-spraying corner move
  M106 S0
  SET_GCODE_VARIABLE MACRO=SPRAY_STATE VARIABLE=spraying VALUE=0
  G1 X{X_END} Y{Y_END}
